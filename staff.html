<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070708">
<title>Catchin' Up · Staff</title>
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="staff-icon-192.png"><link rel="manifest" href="staff.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CU Staff"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#070708;--card:#15151b;--line:#2a2a34;--ink:#f7f3fa;--muted:#aaa6b4;--pink:#ff70e8;--cyan:#32e3ff;--yellow:#ffd84d;--ok:#38d996}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 90px}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;margin:0}h1{font-size:22px}h2{font-size:17px;margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
input{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f0f14;color:var(--ink);margin-top:8px}
.btn{display:block;width:100%;font:inherit;font-weight:700;padding:14px;border-radius:14px;border:1px solid var(--line);background:#1d1d26;color:var(--ink);margin-top:10px;cursor:pointer}
.btn.go{background:var(--pink);border-color:var(--pink);color:#1a0416}.btn.cyan{background:var(--cyan);border-color:var(--cyan);color:#06202a}.btn:disabled{opacity:.35}
.clock{font-family:"Space Grotesk",sans-serif;font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1}.date{color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.steps div{background:#0f0f14;border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px}.steps b{display:block;font-size:14px}.steps .done{border-color:var(--ok);color:var(--ok)}
video,canvas{width:100%;border-radius:14px;background:#000;transform:scaleX(-1)}
.msg{margin-top:10px;font-size:14px;color:var(--cyan)}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}.row b{font-weight:600}
.tabs[hidden]{display:none}.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0c0c10;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;background:transparent;border:0;color:var(--muted);font:inherit;font-size:12px;font-weight:700;padding:8px 2px;border-radius:10px}.tabs button[aria-pressed=true]{color:var(--pink);background:#1a1420}
.tabs span{display:block;font-size:20px}
.logo{height:46px;width:auto}
select,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0f0f14;color:var(--ink);margin-top:8px}textarea{min-height:84px;resize:vertical}
label.lb{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:12px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}.duo .btn{margin-top:0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);background:#0f0f14;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;cursor:pointer}.opt[aria-pressed=true]{border-color:var(--pink);background:#1a1420}.opt b{display:block;font-size:15px}.opt span{font-size:13px;color:var(--muted)}
.opt i{flex:0 0 18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px}.opt[aria-pressed=true] i{border:5px solid var(--pink)}
.seg{display:flex;gap:6px;background:#0f0f14;border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:14px}.seg button{flex:1;font:inherit;font-size:14px;font-weight:700;color:var(--muted);background:transparent;border:0;border-radius:9px;padding:9px 4px;cursor:pointer}.seg button[aria-pressed=true]{background:#24242f;color:var(--ink)}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.mcal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:700}.mcal button{aspect-ratio:1;font:inherit;font-size:14px;border-radius:10px;border:1px solid var(--line);background:#0f0f14;color:var(--ink);padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.mcal button small{font-size:9px;line-height:1;color:var(--muted)}.mcal button.rest{opacity:.5}.mcal button.past{opacity:.3}.mcal button.lv-a{border-color:var(--cyan);background:#0d2430}.mcal button.lv-p{border-color:var(--yellow);border-style:dashed}.mcal button.sel{background:var(--pink);border-color:var(--pink);color:#1a0416}.mcal button.sel small{color:#1a0416}.mcal button.today{outline:2px solid var(--ink);outline-offset:-2px}
.err{color:#ff8a8a;font-size:14px;margin-top:10px}.st{align-self:center;white-space:nowrap;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:#1d1d26}.st.pending{color:var(--yellow)}.st.approved,.st.noted{color:var(--ok)}.st.declined,.st.rejected{color:#ff8a8a}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#14081a;font-weight:800;font-family:"Space Grotesk",sans-serif;flex:0 0 auto}.av-btn{background:none;border:0;padding:0;cursor:pointer;border-radius:50%}
.ann{border-color:var(--yellow);background:#1e1a0c}.ann h2{color:var(--yellow)}
.post{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.post:last-child{border:0}.post .who{font-size:14px}.post .who b{font-weight:700}.post .t{font-size:12px;color:var(--muted)}
.post .ph{display:block;width:100%;max-width:200px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;margin-top:8px;background:#0f0f14;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;transform:scaleX(-1)}
.post .tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px}.tag.in{background:#0f3a2a;color:var(--ok)}.tag.out{background:#15202a;color:var(--cyan)}.tag.off{background:#3a1414;color:#ff8a8a}
.rx{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.rx button{font:inherit;font-size:13px;background:#1d1d26;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:2px 9px;cursor:pointer}.rx button.mine{border-color:var(--pink);background:#2a1426}
.picker{position:fixed;z-index:60;display:flex;gap:4px;background:#22222c;border:1px solid var(--line);border-radius:999px;padding:6px 8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}.picker button{font-size:26px;background:none;border:0;cursor:pointer;padding:2px 4px;transition:transform .1s}.picker button:active{transform:scale(1.3)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow:auto;padding:4px 2px}.bub{max-width:80%;padding:8px 12px;border-radius:16px;background:#1d1d26;font-size:15px;line-height:1.35;white-space:pre-wrap;word-break:break-word;-webkit-user-select:none;user-select:none}.bub small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px;font-weight:700}
.bub.me{align-self:flex-end;background:var(--pink);color:#1a0416;border-bottom-right-radius:4px}.bub.me small{color:#5a0f4c}.bub.them{align-self:flex-start;border-bottom-left-radius:4px}.bub.mgmt{background:#1e1a0c;border:1px solid var(--yellow)}.bub time{display:block;font-size:10px;opacity:.6;margin-top:3px;text-align:right}
.chatbar{display:flex;gap:8px;margin-top:10px}.chatbar textarea{min-height:44px;height:44px;margin:0;resize:none}.chatbar .btn{width:auto;margin:0;padding:0 16px}
.geo{font-size:12px;margin-top:8px;color:var(--muted)}.geo.bad{color:#ff8a8a}
.sw{white-space:nowrap;font:inherit;font-size:12px;font-weight:700;color:var(--pink);background:#2a1426;border:1px solid #4a2040;border-radius:999px;padding:3px 10px;cursor:pointer}
.seg.scroll{overflow-x:auto;scrollbar-width:none}.seg.scroll::-webkit-scrollbar{display:none}.seg.scroll button{flex:0 0 auto;padding:9px 12px}
.chk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.chk:last-child{border:0}.yn{display:flex;gap:6px;flex:0 0 auto}.yn button{font:inherit;font-size:13px;font-weight:700;min-width:52px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#0f0f14;color:var(--muted);cursor:pointer}.yn button.y[aria-pressed=true]{background:#0f3a2a;border-color:var(--ok);color:var(--ok)}.yn button.n[aria-pressed=true]{background:#3a1414;border-color:#ff8a8a;color:#ff8a8a}
.tick{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}.tick input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--pink);flex:0 0 auto}
.shot{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:8px;background:#0f0f14}
.rec{border-left:3px solid var(--line);padding-left:12px}.rec.memo{border-color:var(--cyan)}.rec.evaluation{border-color:var(--ok)}.rec.incident{border-color:var(--yellow)}.rec.progressive{border-color:#ff8a8a}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#1d1d26}.chip.rd{color:var(--yellow)}.chip.ok{color:var(--ok)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
</head>
<body><div class="wrap" id="app"><div class="muted">Loading…</div></div>
<div class="tabs" id="tabs" hidden><button data-t="clock" data-acc="clock" aria-pressed="true"><span>⏱</span>Clock</button><button data-t="sched" data-acc="schedule"><span>📅</span>Schedule</button><button data-t="team" data-acc="team"><span>💬</span>Team</button><button data-t="pay" data-acc="payslips"><span>💸</span>Payroll</button><button data-t="ops" data-acc="ops"><span>🧰</span>Operations</button><button data-t="records" data-acc="records"><span>📁</span>My file</button></div>
<script>
const CFG = window.CU_CONFIG || {}, sb = supabase.createClient(CFG.SUPABASE_URL, CFG.ANON_KEY), $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const pd = v => { const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(v); };
const fmt = v => pd(v).toLocaleDateString("en-PH", { weekday: "short", month: "short", day: "numeric" });
const hhmm = v => { const x = new Date(v); return `${String(x.getHours()).padStart(2, "0")}:${String(x.getMinutes()).padStart(2, "0")}`; };
const t5 = t => String(t || "").slice(0, 5), p2 = n => (Math.round((+n || 0) * 100) / 100).toLocaleString("en-US", { minimumFractionDigits: 2 });
let me = null, E = null, P = null, stream = null, tab = "clock";
const linkType = (location.hash.match(/type=(\w+)/) || [])[1];   // invite / recovery / magiclink
const STEPS = [["time_in", "Time in"], ["lunch_out", "Lunch out"], ["lunch_in", "Lunch in"], ["time_out", "Time out"]];
function workDate(){ const n = new Date(), st = E.default_start ? +E.default_start.slice(0, 2) : 0; if (n.getHours() < 6 && st >= 12){ n.setDate(n.getDate() - 1); } return iso(n); }
const header = () => `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">${E && E.branch === "fm" ? `<img src="logo-funhan.png" alt="Funhan Mart Arnaiz" class="logo">` : `<img src="logo-wide.png" alt="Catchin' Up Pub" class="logo">`}<div style="display:flex;gap:8px;align-items:center">${E ? `<button class="btn" style="width:auto;margin:0;padding:8px 12px;font-size:13px" onclick="goTab('me')">${esc(E.nickname || E.first_name)}</button>` : ""}<button class="btn" style="width:auto;margin:0;padding:8px 12px;font-size:13px" onclick="sb.auth.signOut().then(()=>location.replace(location.pathname))">Sign out</button></div></div>`;
const AVC = ["#ff70e8","#32e3ff","#ffd84d","#38d996","#b18cff","#ff9f5a"];
const face = (p, px = 40) => p && p.selfie && URLS[p.selfie] ? `<img src="${URLS[p.selfie]}" alt="" style="width:${px}px;height:${px}px;border-radius:50%;object-fit:cover;transform:scaleX(-1);flex:0 0 auto">` : avatar(p ? p.name : "", px);
const avatar = (name, px = 36) => { const n = String(name || "?").trim(), c = AVC[[...n].reduce((a, ch) => a + ch.charCodeAt(0), 0) % AVC.length]; return `<span class="av" style="width:${px}px;height:${px}px;font-size:${Math.round(px * .42)}px;background:${c}">${esc(n.slice(0, 1).toUpperCase())}</span>`; };

async function start(){
  const { data: { session } } = await sb.auth.getSession(); if (!session) return login(); me = session.user;
  if (["invite", "recovery"].includes(linkType) && !sessionStorage.getItem("pwset")) return setPassword();
  const { data } = await sb.from("employees").select("*").eq("email", me.email.toLowerCase()).maybeSingle(); E = data;
  if (!E) return $("#app").innerHTML = `${header()}<div class="card"><h2>Almost there</h2><p class="muted">${esc(me.email)} is signed in but isn't on the employee list yet. Ask the manager to add you with this exact email.</p></div>`;
  const ACC = Object.assign({ clock: true, schedule: true, payslips: true, floor: false, team: true, operations: true, records: true }, E.access || {}); ACC.ops = ACC.floor || ACC.operations; window.ACCX = ACC;
  document.querySelectorAll("#tabs button").forEach(b => { if (!ACC[b.dataset.acc]) b.remove(); });
  const first = document.querySelector("#tabs button"); if (!first) return $("#app").innerHTML = `${header()}<div class="card"><h2>No access yet</h2><p class="muted">HR hasn't switched on any pages for you yet. Ask your manager.</p></div>`;
  tab = first.dataset.t; document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-pressed", x === first));
  $("#tabs").hidden = false; document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
  await loadToday(); render(); setInterval(() => { const c = $("#clk"); if (c) c.textContent = new Date().toLocaleTimeString("en-PH", { hour: "2-digit", minute: "2-digit" }); }, 1000);
}
function login(){ $("#app").innerHTML = `<div style="display:flex;justify-content:center;align-items:center;gap:18px;padding:20px 0 6px"><img src="logo.png" alt="Catchin' Up Pub" style="width:170px"><img src="logo-funhan.png" alt="Funhan Mart Arnaiz" style="height:84px;width:auto"></div><h1 style="text-align:center">Staff</h1><p class="muted small" style="text-align:center">Sign in with the email HR has for you.</p><div class="card"><input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn go" id="go">Sign in</button><button class="btn" id="forgot">Forgot password / first sign-in (get a code)</button><div class="msg" id="m"></div></div>`;
  try { const h = new URLSearchParams(location.hash.slice(1)); if (h.get("em")) { $("#em").value = h.get("em"); if (h.get("pw")) { $("#pw").value = h.get("pw"); $("#m").textContent = "Your temporary password is filled in. Tap Sign in."; } history.replaceState(null, "", location.pathname + location.search); } } catch (e) {}
  $("#go").onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $("#em").value.trim(), password: $("#pw").value }); $("#m").textContent = error ? error.message : ""; if (!error) start(); };
  $("#forgot").onclick = async () => { const em = $("#em").value.trim().toLowerCase(); if (!em) return $("#m").textContent = "Type your email first."; $("#forgot").disabled = true; $("#m").textContent = "Sending a code…";
    const r = await fetch(`${CFG.SUPABASE_URL}/functions/v1/staff`, { method: "POST", headers: { "Content-Type": "application/json", apikey: CFG.ANON_KEY }, body: JSON.stringify({ action: "reset_code", email: em }) }).then(x => x.json()).catch(() => ({ ok: false, error: "No connection. Try again." }));
    $("#forgot").disabled = false; if (!r.ok) return $("#m").textContent = r.error || "Couldn't send the code."; codeScreen(em); }; }
function codeScreen(em){ $("#app").innerHTML = `<div style="text-align:center;padding:20px 0 6px"><img src="logo.png" alt="" style="width:170px"></div><h1 style="text-align:center">Set your password</h1><p class="muted small" style="text-align:center">We emailed a code to <b>${esc(em)}</b>. Check Spam or Promotions too. The code works for 1 hour.</p>
  <div class="card"><input id="cd" inputmode="numeric" maxlength="8" placeholder="Code from the email" autocomplete="one-time-code" style="letter-spacing:.3em;text-align:center;font-size:22px"><input id="p1" type="password" placeholder="New password (8+ characters)" autocomplete="new-password"><input id="p2" type="password" placeholder="Type it again" autocomplete="new-password"><button class="btn go" id="setc">Save password and sign in</button><button class="btn" onclick="login()">Back</button><div class="msg" id="m"></div></div>`;
  $("#setc").onclick = async () => { const code = $("#cd").value.replace(/\D/g, ""), a = $("#p1").value, b = $("#p2").value;
    if (code.length < 6 || code.length > 8) return $("#m").textContent = "Enter the whole code from the email."; if (a.length < 8) return $("#m").textContent = "Use at least 8 characters."; if (a !== b) return $("#m").textContent = "The two passwords don't match.";
    $("#setc").disabled = true; $("#m").textContent = "Checking…";
    const { error } = await sb.auth.verifyOtp({ email: em, token: code, type: "recovery" }); if (error){ $("#setc").disabled = false; return $("#m").textContent = /expired|invalid/i.test(error.message) ? "That code is wrong or expired. Go back and send a new one." : error.message; }
    const { error: e2 } = await sb.auth.updateUser({ password: a }); if (e2){ $("#setc").disabled = false; return $("#m").textContent = e2.message; }
    try { sessionStorage.setItem("pwset", "1"); } catch (e) {} start(); }; }
function setPassword(){ $("#app").innerHTML = `<div style="text-align:center;padding:20px 0 6px"><img src="logo.png" alt="" style="width:200px"></div><h1 style="text-align:center">Welcome${me.user_metadata?.first_name ? ", " + esc(me.user_metadata.first_name) : ""}!</h1><p class="muted small" style="text-align:center">Create the password you'll use to sign in on your phone.</p><div class="card"><input id="p1" type="password" placeholder="New password (8+ characters)" autocomplete="new-password"><input id="p2" type="password" placeholder="Repeat password" autocomplete="new-password"><button class="btn go" id="setp">Save password</button><div class="msg" id="m"></div></div>`;
  $("#setp").onclick = async () => { const a = $("#p1").value, b = $("#p2").value; if (a.length < 8) return $("#m").textContent = "Use at least 8 characters."; if (a !== b) return $("#m").textContent = "The two passwords don't match."; const { error } = await sb.auth.updateUser({ password: a }); if (error) return $("#m").textContent = error.message; sessionStorage.setItem("pwset", "1"); history.replaceState(null, "", location.pathname); start(); }; }
let PT = [];
const FLEX = () => !!(E && E.access && E.access.flex);
const isFieldP = () => !!(P && P.geo && Object.values(P.geo).some(g => g && g.field));
const fieldNote = () => { if (!P || !P.geo) return ""; const g = Object.values(P.geo).reverse().find(x => x && x.field && x.note); return g ? g.note : ""; };
async function loadToday(){ const { data } = await sb.from("punches").select("*").eq("employee_id", E.id).eq("work_date", workDate()).eq("source", "app").order("created_at", { ascending: false }).limit(30); PT = data || []; P = PT[0] || null; }
const onBreak = p => !!(p && p.time_out && p.geo && p.geo.time_out && p.geo.time_out.lunch);
function next(){ if (FLEX()) return !P || P.time_out ? "time_in" : "time_out"; if (!P) return "time_in";
  if (P.time_out) return onBreak(P) ? "lunch_in" : "time_in";   // no limit: after time out you can time in again
  if (P.lunch_out && !P.lunch_in) return "lunch_in";
  return "lunch_out"; }                                         // working: Lunch out or Time out, any number of times
function render(){ if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } if (floorTimer){ clearInterval(floorTimer); floorTimer = null; } if (tab !== "team") teamOff(); ({ clock, sched, pay, ops, records, team, me: myProfile })[tab](); }

/* clock */
function clock(){
  const n = next(), label = Object.fromEntries(STEPS);
  $("#app").innerHTML = `${header()}<div id="anns"></div><div id="regbox"></div><div id="rolebox"></div><div class="card"><div class="muted small">Hi, ${esc(E.first_name.split(" ")[0])}</div><div class="clock" id="clk">${new Date().toLocaleTimeString("en-PH", { hour: "2-digit", minute: "2-digit" })}</div><div class="date">${new Date().toLocaleDateString("en-PH", { weekday: "long", month: "long", day: "numeric" })} · shift date ${fmt(workDate())}</div>
      ${FLEX() ? `<div class="small muted" style="margin-top:12px;font-weight:700">Today's log-ins (no lunch break needed)</div>${PT.length ? [...PT].reverse().map((x, i) => `<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="small">#${i + 1}</span><span class="small">In <b>${hhmm(x.time_in)}</b> · Out <b>${x.time_out ? hhmm(x.time_out) : "—"}</b></span></div>`).join("") : `<div class="small muted">No log-ins yet today.</div>`}` : (() => { const cur = P && !P.time_out ? P : null, past = PT.filter(x => x !== cur);

function crMatch(cfg, slots, audits){ const used = new Set(), now = Date.now(), B = cfg.before * 60000, A = cfg.after * 60000;
  return slots.map(s => { const hit = audits.filter(x => !used.has(x.id)).map(x => ({ x, ts: +new Date(x.created_at) })).filter(o => o.ts >= +s.at - B && o.ts <= +s.at + A).sort((p, q) => p.ts - q.ts)[0];
    if (hit) used.add(hit.x.id); const st = hit ? "done" : now < +s.at - B ? "upcoming" : now <= +s.at + A ? "due" : "missed"; return { ...s, audit: hit ? hit.x : null, st }; }); }

  const col = { free: "#1d1d26", reserved: "#3a2f0c", later: "#15202a", seated: "#0f3a2a" }, bord = { free: "var(--line)", reserved: "var(--yellow)", later: "var(--cyan)", seated: "var(--ok)" };
  $("#opsbox").innerHTML = `<div class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">Floor · ${fmt(d)}</h2><div style="display:flex;gap:6px">${areas.map(a => `<button class="btn" style="width:auto;margin:0;padding:7px 12px;font-size:13px;${a === fArea ? "background:#fff;color:#07070a" : ""}" onclick="fArea='${a}';render()">${esc(a)}</button>`).join("")}</div></div>
    <div class="small muted" style="margin:6px 0 8px"><span style="color:var(--ok)">■</span> seated · <span style="color:var(--yellow)">■</span> reserved, arriving within 2 h · <span style="color:var(--cyan)">■</span> reserved later · tap a table</div>
    <div style="overflow:auto;border:1px solid var(--line);border-radius:12px;background:#0b0b10"><div style="position:relative;width:${W}px;height:${Hh}px">${FT.filter(t => t.area === fArea).map(t => { const st = tableState(t); return `<button onclick="tapTable('${t.id}')" style="position:absolute;left:${t.x}px;top:${t.y}px;width:84px;height:72px;border-radius:${t.shape === "square" ? "12px" : "50%"};border:2px solid ${bord[st.k]};background:${col[st.k]};color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px"><b style="font-size:15px">${esc(t.code)}</b>${st.b ? `<span style="font-size:11px;line-height:1.2;color:var(--ink2);text-align:center;overflow:hidden;max-height:28px">${esc(st.b.name.split(" ")[0])} · ${st.b.guests}p<br>${st.k === "seated" ? hhmm(st.b.seated_at) : t5(st.b.time)}</span>` : `<span style="font-size:11px;color:var(--muted)">free</span>`}</button>`; }).join("")}</div></div></div>
    <div class="card"><h2>Tonight's bookings <span class="muted small">${FB.length}</span></h2>${FB.sort((a, b) => bMin(a) - bMin(b)).map(b => `<div class="row" style="align-items:center"><span><b>${t5(b.time)}</b> ${esc(b.name)} · ${b.guests} pax · ${esc(b.area)}<br><span class="small muted">${esc(b.ref)} · ${b.status}${(b.table_codes || []).length ? " · tables " + b.table_codes.join(", ") : " · <span style='color:var(--yellow)'>no table yet</span>"}</span></span><span style="display:flex;gap:6px">${b.status !== "Seated" ? `<button class="btn" style="width:auto;margin:0;padding:6px 10px;font-size:12px" onclick="pickFor('${b.id}')">Assign</button>` : `<button class="btn" style="width:auto;margin:0;padding:6px 10px;font-size:12px" onclick="fAct('clear','${b.id}')">Clear</button>`}</span></div>`).join("") || "<div class='muted'>No bookings yet tonight.</div>"}</div>`;
  if (unassigned.length) toastF(`${unassigned.length} booking${unassigned.length > 1 ? "s" : ""} still without a table`);
  floorTimer = setInterval(async () => { if (tab !== "ops" || opsSub !== "floor" || document.getElementById("fmodal")) return; await loadFloor(); if (tab === "ops" && opsSub === "floor") render(); }, 60000);
}
function toastF(t){ const el = document.getElementById("ftoast") || Object.assign(document.body.appendChild(document.createElement("div")), { id: "ftoast" }); el.style.cssText = "position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--yellow);color:#1a1400;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;z-index:50"; el.textContent = t; clearTimeout(el._t); el._t = setTimeout(() => el.remove(), 3000); }
function fModal(html){ let m = document.getElementById("fmodal"); if (!m){ m = document.createElement("div"); m.id = "fmodal"; m.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:12px"; m.onclick = e => { if (e.target === m) m.remove(); }; document.body.appendChild(m); } m.innerHTML = `<div class="card" style="width:100%;max-width:480px;max-height:85vh;overflow:auto">${html}</div>`; }
const closeF = () => { const m = document.getElementById("fmodal"); if (m) m.remove(); };
function tapTable(id){ const t = FT.find(x => x.id === id), st = tableState(t);
  if (st.k === "seated") return fModal(`<h2>${esc(t.code)} · ${esc(st.b.name)}</h2><p class="muted small">${st.b.guests} pax · seated ${hhmm(st.b.seated_at)} · ${esc(st.b.ref)}${(st.b.table_codes || []).length > 1 ? " · also " + st.b.table_codes.filter(c => c !== t.code).join(", ") : ""}</p><button class="btn cyan" onclick="fAct('clear','${st.b.id}')">Clear table (guests left)</button><button class="btn" onclick="fAct('unseat','${st.b.id}')">Undo seating</button><button class="btn" onclick="closeF()">Close</button>`);
  if (st.b) return fModal(`<h2>${esc(t.code)} · reserved</h2><p class="muted small">${esc(st.b.name)} · ${st.b.guests} pax at ${t5(st.b.time)} · ${esc(st.b.ref)} · ${st.b.status}</p><button class="btn go" onclick="fAct('seat','${st.b.id}')">They're here, seat them</button><button class="btn" onclick="pickFor('${st.b.id}')">Change tables</button><button class="btn" onclick="fAct('noshow','${st.b.id}')">No-show, release</button><button class="btn" onclick="closeF()">Close</button>`);
  const waiting = FB.filter(b => b.status !== "Seated" && b.area === t.area).sort((a, b) => bMin(a) - bMin(b));
  fModal(`<h2>${esc(t.code)} · free</h2><p class="muted small">Seat a booking here, or a walk-in.</p>${waiting.map(b => `<button class="btn" onclick="fAct('seat','${b.id}',['${t.code}'])"><span style="display:block">${t5(b.time)} · ${esc(b.name)} · ${b.guests} pax</span><span class="small muted">${esc(b.ref)}${(b.table_codes || []).length ? " · " + b.table_codes.join(", ") : ""}</span></button>`).join("")}
    <div style="border-top:1px solid var(--line);margin:12px 0 6px"></div><label class="small muted">Walk-in: guests</label><input id="wi-g" type="number" value="2" min="1" max="18"><input id="wi-n" placeholder="Name (optional)"><button class="btn go" onclick="walkIn('${t.code}','${esc(t.area)}')">Seat walk-in at ${esc(t.code)}</button><button class="btn" onclick="closeF()">Close</button>`); }
let PK = null;
function pickFor(id){ const b = FB.find(x => x.id === id); PK = { b, sel: new Set(b.table_codes || []) }; drawPick(); }
function pkTog(code){ if (PK.sel.has(code)) PK.sel.delete(code); else PK.sel.add(code); drawPick(); }
function drawPick(){ const { b, sel } = PK; const list = FT.filter(t => t.area === b.area);
  fModal(`<h2>Tables for ${esc(b.name)}</h2><p class="muted small">${b.guests} pax needs ${b.tables} table${b.tables > 1 ? "s" : ""} · ${esc(b.area)}. Tap to pick ${sel.size}/${b.tables}.</p><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px">${list.map(t => { const st = tableState(t); const busy = st.k === "seated" || (st.b && st.b.id !== b.id && st.k === "reserved"); return `<button class="btn" style="margin:0;padding:10px 4px;${sel.has(t.code) ? "background:var(--pink);color:#1a0416;border-color:var(--pink)" : busy ? "opacity:.35" : ""}" ${busy ? "disabled" : ""} onclick="pkTog('${t.code}')">${esc(t.code)}</button>`; }).join("")}</div><button class="btn go" onclick="fAct('assign','${b.id}',${JSON.stringify([...sel]).replace(/"/g, "&quot;")})" ${sel.size ? "" : "disabled"}>Save tables</button><button class="btn" onclick="closeF()">Cancel</button>`); }
async function fAct(action, id, codes){ const { data, error } = await sb.rpc("floor_action", { p: { action, id, codes: codes || [] } }); if (error || !data?.ok) return toastF((error || {}).message || data?.error || "Failed"); closeF(); await loadFloor(); render(); }
async function walkIn(code, area){ const { data, error } = await sb.rpc("floor_action", { p: { action: "walkin", branch: E.branch, area, codes: [code], guests: +$("#wi-g").value || 2, name: $("#wi-n").value } }); if (error || !data?.ok) return toastF((error || {}).message || data?.error || "Failed"); closeF(); await loadFloor(); render(); }

/* attendance health */
let HP = null;
const hpCol = b => ({ Excellent: "#3ddc84", Good: "#4fc3f7", "Needs improvement": "#ffb300", "At risk": "#ff5252" })[b] || "#aaa";
async function loadHealth(){ const box = document.getElementById("hp"); if (!box) return;
  const { data, error } = await sb.rpc("attendance_health", { p_emp: E.id }); if (error || !data) return; HP = data; const col = hpCol(data.band);
  box.style.display = ""; box.innerHTML = `<div style="display:flex;align-items:center;gap:14px" onclick="healthSheet()"><div style="width:58px;height:58px;border-radius:50%;border:5px solid ${col};display:grid;place-items:center;font-size:19px;font-weight:800;color:${col};flex:none">${+data.score}</div><div style="flex:1"><b>Attendance health</b><div class="small" style="color:${col};font-weight:700">${data.band}</div><div class="muted small">${data.items.filter(i => i.points < 0).length ? `${data.items.filter(i => i.points < 0).length} issue(s) this period` : "No issues this period. Keep it up!"}</div></div><span class="muted">›</span></div>`; }
async function healthSheet(){ if (!HP) return; const col = hpCol(HP.band); const { data: c } = await sb.rpc("attendance_cfg"); const r = c || {};
  fModal(`<h2>Attendance health</h2><div style="display:flex;align-items:center;gap:14px;margin-bottom:8px"><div style="width:70px;height:70px;border-radius:50%;border:6px solid ${col};display:grid;place-items:center;font-size:22px;font-weight:800;color:${col}">${+HP.score}</div><div><b style="color:${col}">${HP.band}</b><div class="muted small">${fmt(HP.from)} – ${fmt(HP.to)}</div><div class="muted small">Starts at 100 ${r.period === "rolling30" ? "and covers the last 30 days" : "every 1st of the month"}.</div></div></div>
    ${HP.items.length ? HP.items.map(i => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span class="small">${fmt(i.date)} · ${esc(i.kind)}</span><b style="color:${i.points < 0 ? "#ff5252" : "#3ddc84"}">${i.points > 0 ? "+" : ""}${+i.points}</b></div>`).join("") : `<p class="muted">No issues this period.</p>`}
    ${c ? `<div class="muted small" style="margin-top:12px;line-height:1.6"><b>How points work</b><br>Late after ${r.grace} min grace: −${r.late_1} (up to 15 min), −${r.late_2} (16–30), −${r.late_3} (30+). Sending a “running late” notice before your shift lowers it.<br>Absent with notice ${Math.round(r.notice_min / 60 * 10) / 10}h+ ahead −${r.absent_notice}, late notice −${r.absent_late_notice}, no call no show −${r.no_show}.<br>No time-out −${r.missed_punch} · left early without approved UT −${r.undertime} · punched off-site −${r.offsite}.<br>A clean week earns +${r.clean_week_bonus} back. Approved leave and rest days never count.</div>` : ""}
    <button class="btn" style="margin-top:12px" onclick="closeF()">Close</button>`); }

function nextAnnivS(d){ const h = pd(d), t = new Date(); t.setHours(0, 0, 0, 0); let a = new Date(t.getFullYear(), h.getMonth(), h.getDate()); if (a <= t) a = new Date(t.getFullYear() + 1, h.getMonth(), h.getDate()); return iso(a); }
/* install as an app (no Play Store / App Store needed) */
let INSTALL_EVT = null;
const IS_APP = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("staff-sw.js").catch(() => {});
addEventListener("beforeinstallprompt", e => { e.preventDefault(); INSTALL_EVT = e; installBar(); });
addEventListener("appinstalled", () => { document.getElementById("instbar")?.remove(); toastF("App installed. Open it from your home screen."); });
function installBar(){
  if (IS_APP() || document.getElementById("instbar")) return;
  try { if (localStorage.getItem("inst_hide") && !/install=1/.test(location.search)) return; } catch (e) {}
  const d = document.createElement("div"); d.id = "instbar";
  d.style.cssText = "position:fixed;left:12px;right:12px;bottom:84px;z-index:60;background:#17171c;border:1px solid #ff70e8;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)";
  const how = INSTALL_EVT ? "" : IS_IOS ? "In Safari, tap <b>Share</b> ⬆ then <b>Add to Home Screen</b>." : "Tap the browser menu <b>⋮</b> then <b>Install app</b> or <b>Add to Home screen</b>.";
  d.innerHTML = `<img src="staff-icon-192.png" style="width:44px;height:44px;border-radius:10px"><div style="flex:1;font-size:13px;line-height:1.4"><b>Install the staff app</b><br><span style="color:#aaa">${how || "One tap, no Play Store needed."}</span></div>${INSTALL_EVT ? `<button id="instgo" style="background:#ff70e8;color:#1a0416;border:0;border-radius:10px;padding:10px 14px;font-weight:700">Install</button>` : ""}<button id="instx" aria-label="Close" style="background:none;border:0;color:#888;font-size:20px">×</button>`;
  document.body.appendChild(d);
  if (INSTALL_EVT) d.querySelector("#instgo").onclick = async () => { INSTALL_EVT.prompt(); const r = await INSTALL_EVT.userChoice; INSTALL_EVT = null; if (r.outcome === "accepted") d.remove(); };
  d.querySelector("#instx").onclick = () => { d.remove(); try { localStorage.setItem("inst_hide", "1"); } catch (e) {} };
}
setTimeout(installBar, 1500);
/* incomplete registration: 48 hours to submit ID / government numbers */
const REG_MISS = () => { if (!E) return []; return [...(!E.id_photo || !E.id_type ? ["Valid ID"] : []), ...(!E.sss_no ? ["SSS number"] : []), ...(!E.philhealth_no ? ["PhilHealth number"] : []), ...(!E.pagibig_no ? ["Pag-IBIG number"] : []), ...(!E.tin ? ["TIN"] : [])]; };
function regBox(){ const box = document.getElementById("regbox"); if (!box) return; const inc = E?.consent?.incomplete, miss = REG_MISS();
  if (!inc || inc.completed_at || !miss.length) return box.innerHTML = "";
  const due = new Date(inc.due), left = due - Date.now(), over = left <= 0, h = Math.max(0, Math.floor(left / 3600000)), m = Math.max(0, Math.floor(left / 60000) % 60);
  box.innerHTML = `<div class="card" style="border-color:${over ? "#ff5252" : "#ffb300"};background:${over ? "rgba(255,82,82,.08)" : "rgba(255,179,0,.07)"}"><b style="color:${over ? "#ff5252" : "#ffb300"}">${over ? "⚠️ Registration overdue" : "📝 Complete your registration"}</b>
    <div class="small" style="margin:6px 0 10px">Missing: <b>${miss.join(", ")}</b><br>${over ? `It was due ${due.toLocaleString("en-PH", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}. You may receive a letter of non-compliance. Submit it now.` : `Due ${due.toLocaleString("en-PH", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })} · <b>${h}h ${m}m left</b>`}</div>
    <button class="btn ${over ? "" : "go"}" onclick="regSheet()">Submit missing requirements</button></div>`; }
function regSheet(){ const miss = REG_MISS(), needId = miss.includes("Valid ID"); let IDIMG = null;
  const f = (k, l, ph) => miss.includes(l) ? `<label class="lb">${l}</label><input id="rg-${k}" placeholder="${ph}">` : "";
  fModal(`<h2>Missing requirements</h2><p class="small muted" style="margin:0">Fill in what you have now. You can come back for the rest.</p>
    ${needId ? `<label class="lb">Valid ID type</label><select id="rg-idt"><option value="">Choose…</option>${["PhilSys National ID", "UMID", "Driver's License", "Passport", "SSS ID", "PhilHealth ID", "Postal ID", "Voter's ID", "PRC ID", "Other government ID"].map(x => `<option ${E.id_type === x ? "selected" : ""}>${x}</option>`).join("")}</select>
      <label class="lb">ID number</label><input id="rg-idn" value="${esc(E.id_number || "")}"><label class="lb">Photo of your ID</label><label class="btn" style="display:block;text-align:center">📷 Take or choose photo<input type="file" id="rg-idf" accept="image/*" capture="environment" hidden></label><img id="rg-prev" style="display:none;width:100%;border-radius:12px;margin-top:8px">` : ""}
    ${f("sss", "SSS number", "34-1234567-8")}${f("ph", "PhilHealth number", "12-345678901-2")}${f("pi", "Pag-IBIG number", "1234-5678-9012")}${f("tin", "TIN", "123-456-789-000")}
    <div class="err" id="rg-err"></div><button class="btn go" id="rg-go">Submit</button><button class="btn" onclick="closeF()">Later</button>`);
  if (needId) $("#rg-idf").onchange = async ev => { const file = ev.target.files[0]; if (!file) return; const blob = await shrink(file, 1600); IDIMG = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); }); const p = $("#rg-prev"); p.src = IDIMG; p.style.display = "block"; };
  $("#rg-go").onclick = async () => { const v = id => ($(id)?.value || "").trim(); const body = { action: "complete_profile", sss_no: v("#rg-sss"), philhealth_no: v("#rg-ph"), pagibig_no: v("#rg-pi"), tin: v("#rg-tin"), id_type: v("#rg-idt"), id_number: v("#rg-idn"), id_photo: IDIMG };
    if (needId && IDIMG && !body.id_type) return $("#rg-err").textContent = "Choose the ID type.";
    $("#rg-go").disabled = true; $("#rg-go").textContent = "Saving…";
    const { data, error } = await sb.functions.invoke("staff", { body }); if (error || !data?.ok){ $("#rg-go").disabled = false; $("#rg-go").textContent = "Submit"; return $("#rg-err").textContent = (data && data.error) || "Couldn't save. Try again."; }
    const { data: e2 } = await sb.from("employees").select("*").eq("id", E.id).maybeSingle(); if (e2) E = e2;
    fModal(data.missing.length ? `<h2>Saved ✓</h2><p class="muted">Still missing: <b>${data.missing.join(", ")}</b>. Submit them before your deadline.</p><button class="btn go" onclick="closeF();render()">OK</button>` : `<h2>All done ✓</h2><p class="muted">Your registration is complete. Thank you!</p><button class="btn go" onclick="closeF();render()">OK</button>`); }; }
sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_IN" && !me) start(); });
start();
</script>
