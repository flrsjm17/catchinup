<style>
:root{--ink:#161616;--muted:#5e5e5e;--line:#e4e4e4;--soft:#f6f6f6;--accent:#1f7a8c;--green:#1f9d55;--amber:#8a5a00;--amber-bg:#fff6e3;--red:#c62828;--card:#fff}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:#fff}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;margin:0 0 8px;font-weight:600}h1{font-size:26px}h2{font-size:20px}h3{font-size:16px;font-weight:700}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.small{font-size:13px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;text-decoration:none;display:inline-block}
.btn.primary{background:var(--ink);color:#fff}.btn.sm{padding:5px 11px;font-size:13px}.btn.ghost{border-color:var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}label.f>*{font-weight:400;color:var(--ink)}
.app{display:flex;min-height:100vh}
.side{width:232px;flex:none;position:sticky;top:0;height:100vh;background:#0b0b0e;color:#efe9e1;display:flex;flex-direction:column;padding:18px 14px;gap:6px}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:15px;line-height:1.15;color:#efe9e1;white-space:nowrap}.side .brand img{height:34px;width:34px;border-radius:9px}.side .brand span{display:block;font-weight:500;font-size:11px;color:#8a8278;letter-spacing:.08em;text-transform:uppercase}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;color:#b9b2a8;transition:transform .15s,background .15s,color .15s}
.side nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side nav button:hover{background:#1a1a20;color:#fff;transform:scale(1.03)}
.side nav button[aria-current=page]{background:#efe9e1;color:#0b0b0e}
.side .bottom{margin-top:auto;font-size:12px;color:#8a8278;display:flex;flex-direction:column;gap:6px;padding:8px}
.side .bottom .btn{border-color:#2a2a30;background:transparent;color:#efe9e1}.side .bottom .btn:hover{background:#1a1a20}
.wrap{flex:1;min-width:0;max-width:1180px;padding:24px 28px 60px}
.btn,.card,.kpi,.tabs button,.day{transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled),.tabs button:hover{transform:scale(1.04)}
.card:hover,.kpi:hover{transform:scale(1.012);box-shadow:0 6px 24px rgba(0,0,0,.07)}
.day:hover{transform:scale(1.03);box-shadow:0 4px 14px rgba(0,0,0,.08);position:relative;z-index:1}
body.ro #main .btn:not(.keep),body.ro .modal .btn:not(.keep),body.ro #main .actions:not(.keep),body.ro .modal .actions:not(.keep){display:none!important}
body.ro .modal select,body.ro .modal textarea,body.ro .modal input[type=checkbox],body.ro #main input[type=file],body.ro #main textarea{pointer-events:none;opacity:.6}
body.ro .modal h3:has(+ .actions:not(.keep)){display:none}
.ro-badge{display:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a5a00;background:#fff6e3;border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle}body.ro .ro-badge{display:inline-block}
.perm-grid{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:14px}.perm-grid .lv{display:flex;gap:4px}.perm-grid .lv button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}.perm-grid .lv button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.role-chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef6f8;color:#0f5f6c}
.soon{display:inline-block;background:#ff70e8;color:#0b0b0e;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
@media(max-width:860px){.app{flex-direction:column}.side{width:auto;height:auto;position:static;padding:10px 12px}.side nav{flex-direction:row;flex-wrap:wrap}.side nav button{width:auto;padding:8px 11px;font-size:13px}.side .bottom{margin-top:8px;flex-direction:row;align-items:center;flex-wrap:wrap}.wrap{padding:16px 14px 50px}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:0 0 16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-family:"Space Grotesk",sans-serif;font-size:26px;font-weight:700;line-height:1.1}.kpi .l{font-size:13px;color:var(--muted)}
.kpi .bar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:8px}.kpi .bar i{display:block;height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{background:var(--soft);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
tr.row{cursor:pointer}tr.row:hover td{background:#fafafa}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.c-New,.c-Booked{background:#eef6f8;color:#0f5f6c}.c-Seated{background:#eeeeee;color:#333}
.c-Pencil{background:#ffe88a;color:#5c4500}.c-Contacted{background:#ffc98a;color:#7a3a00}.c-SOA{background:#bcd8ff;color:#0b3d91}.c-Down,.c-Deposit,.c-Confirmed{background:#9fe0b6;color:#0f4d26}.c-Cancelled,.c-Lost{background:#ffb3b3;color:#8a1111}.c-Rescheduled{background:#ffc2ec;color:#8a1e6c}.c-No-show{background:#f1f1f1;color:#777}
.p-Pencil{background:#ffe88a;color:#5c4500}.p-Contacted{background:#ffb060;color:#4a2300}.p-SOA{background:#8fc0ff;color:#0b3d91}.p-Down{background:#4ccc7a;color:#0f3d1f}.p-Cancelled{background:#ff8a8a;color:#5a0b0b;text-decoration:line-through}.p-Rescheduled{background:#ff9ee0;color:#5a1245}
.pipe{display:grid;gap:0;margin:10px 0 4px}.pstep{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:8px 0;position:relative}
.pstep .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 12px "Space Grotesk",sans-serif;color:var(--muted);background:#fff;position:relative;z-index:1}
.pstep:not(:last-child):before{content:"";position:absolute;left:12px;top:36px;bottom:-8px;width:2px;background:var(--line)}
.pstep.done .dot{background:var(--green);border-color:var(--green);color:#fff}.pstep.now .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.pstep .t{font-weight:700}.pstep.next .t{color:var(--muted);font-weight:600}.pstep .s{font-size:13px;color:var(--muted)}.pstep .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pstep.now{background:var(--soft);border-radius:12px;padding:10px 10px 12px;margin:2px -10px}.pstep.now:before{left:22px}
.check{display:grid;gap:8px;margin:8px 0 14px}.check label{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}.check label input{margin-top:3px}
.soa-only{display:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px}
.day{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px;font-size:12px;cursor:pointer}
.day.off{opacity:.45}.day.today{outline:2px solid var(--accent)}.day .d{font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between}
.pill{border-radius:6px;padding:2px 6px;margin-top:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-pub{background:var(--green);color:#fff}.p-ok{background:#bfe8cf;color:#115a30}.p-wait{border:1.5px dashed #d98e04;color:#7a5000}.p-plan{background:var(--soft);color:var(--muted)}
.p-res{background:#eef6f8;color:#0f5f6c}.p-ev{background:var(--ink);color:#fff}.p-evp{border:1.5px dashed var(--ink);color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:8px 0}.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 10px;font-size:14px;margin:10px 0}.kv b{color:var(--muted);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.timeline{border-left:2px solid var(--line);margin:8px 0 0 6px;padding-left:14px;font-size:13px}.timeline div{margin-bottom:6px}
.load{display:grid;grid-template-columns:repeat(auto-fit,minmax(36px,1fr));gap:4px;margin:6px 0 12px}
.load div{text-align:center;font-size:11px;border-radius:6px;padding:4px 2px;background:var(--soft)}.load b{display:block;font-size:13px}
.login{max-width:400px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}
.prog{height:8px;background:var(--soft);border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
.empty{color:var(--muted);padding:20px;text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}.tabs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:10px 0}
pre.sum{white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace;background:var(--soft);border-radius:10px;padding:10px;max-height:40vh;overflow:auto}
@media print{.soa-only{display:block}.side,.tabs,.toolbar,.actions,button{display:none!important}.wrap{max-width:none;padding:0}body{font-size:12px}}
@media(max-width:700px){.day{min-height:70px}.wrap{padding:14px 12px}.kv{grid-template-columns:1fr}}

/* soft launch */
.sl-bg{position:fixed;inset:0;z-index:90;background:rgba(10,10,14,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px}.sl-bg.open{display:flex}
.sl{background:#0b0b0e;color:#efe9e1;border:1px solid #2a2a30;border-radius:18px;max-width:520px;width:100%;padding:28px 26px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.sl .tag{display:inline-block;background:#ff70e8;color:#0b0b0e;font:700 11px/1.4 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.sl h3{font:700 26px/1.1 "Space Grotesk",sans-serif;margin:14px 0 8px;color:#fff}.sl p{margin:0 0 10px;color:#b9b2a8;font-size:15px;line-height:1.55}
.sl textarea,.sl input{width:100%;background:#15151a;border:1px solid #2a2a30;color:#fff;border-radius:10px;padding:10px 12px;font:inherit;margin-top:8px}
.sl .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.sl .b{border:1px solid #efe9e1;background:transparent;color:#efe9e1;border-radius:999px;padding:10px 18px;font:700 14px Inter,sans-serif;cursor:pointer}.sl .b.p{background:#efe9e1;color:#0b0b0e}
.fb-pill{position:fixed;right:16px;bottom:16px;z-index:30;background:#0b0b0e;color:#efe9e1;border:1px solid #2a2a30;border-radius:999px;padding:10px 16px;font:700 13px Inter,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35)}.fb-pill:hover{transform:scale(1.04)}
</style>

<script>
const CFG = window.CU_CONFIG || {};
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const peso = n => "₱" + Math.round(Number(n) || 0).toLocaleString("en-US");
const chip = s => s ? `<span class="chip c-${String(s).split(" ")[0]}">${esc(s)}</span>` : "";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const BRN = {sa:"San Antonio Place", ju:"Jupiter Street"};
const SLOTN = {aft:"Afternoon 1–5 PM", eve:"Evening 7–11 PM"};
function toast(t){ const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("show"), 2400); }
const pd = v => { if (!v) return null; const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(v); };
const iso = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` : "";
const fmt = d => d ? d.toLocaleDateString("en-PH", {weekday:"short", month:"short", day:"numeric"}) : "";
const fmtTs = v => v ? new Date(v).toLocaleString("en-PH", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : "";
const ampm = t => { const m = String(t || "").match(/(\d{1,2}):(\d{2})/); if (!m) return t || ""; const h = +m[1]; return `${h % 12 || 12}:${m[2]} ${h < 12 ? "AM" : "PM"}`; };
const today = new Date(); today.setHours(0, 0, 0, 0);
let D = {bookings:[], inquiries:[], activity:[], posts:[], checklist:[], log:[], staff:[], settings:{}, terms:{}, branches:[], blocks:[], leads:[]}, page = "dash", cur = {y: today.getFullYear(), m: today.getMonth()}, me = null, myRole = "events", P = {}, pageRo = false;
/* ---------- roles & access ---------- */
const PERM_CATS = [["A","Bookings (tables & big groups)"],["B","Private events (inquiries)"],["C","Calendar & blocked dates"],["D","Marketing"],["E","Playbook"],["S","Table seating (branch)"],["F","HR · people"],["G","HR · time & attendance"],["H","Payroll"],["I","Settings"]];

  marketing_associate: {A:"edit",B:"edit",C:"edit",D:"edit",E:"edit",F:"none",G:"none",H:"none",I:"none",S:"view",C3:false,D2:false,D4:false,H3:false,H4:false,I4:false,I5:true},
  cashier: {A:"view",B:"none",C:"none",D:"none",E:"none",F:"none",G:"none",H:"none",I:"none",S:"edit",C3:false,D2:false,D4:false,H3:false,H4:false,I4:false,I5:false},

/* ---------- auth ---------- */

/* ---------- data ---------- */

  const [b, i, a, p, c, l, s, t, br, bl, ld] = await Promise.all([
    sb.from("bookings").select("*").gte("date", since).order("date").order("time"),
    sb.from("inquiries").select("*").gte("event_date", since).order("event_date"),
    sb.from("activity").select("*").order("created_at", { ascending: false }).limit(500),
    sb.from("content_posts").select("*").order("planned_date"),
    sb.from("content_checklist").select("*").order("month"),
    sb.from("enquiry_log").select("*").order("received_at", { ascending: false }),
    sb.from("settings").select("*"), sb.from("consultant_terms").select("*"), sb.from("branches").select("*"), sb.from("booking_blocks").select("*").order("from_date"), sb.from("leads").select("*").order("created_at")]);
  D.bookings = b.data || []; D.inquiries = i.data || []; D.activity = a.data || []; D.posts = p.data || []; D.checklist = c.data || []; D.log = l.data || [];
  D.settings = Object.fromEntries((s.data || []).map(r => [r.key, r.value])); D.terms = (t.data || [])[0]?.value || {}; D.branches = br.data || []; D.blocks = bl.data || []; D.leads = ld.data || [];
}

function calendar(cellFn, dayClick){ const first = new Date(cur.y, cur.m, 1), start = first.getDay(), dim = new Date(cur.y, cur.m + 1, 0).getDate(); let cells = "";

function kpiView(key, T){

    <div class="card" style="margin-bottom:14px"><h3>By associate</h3><table><tr><th>Associate</th><th>Handled</th><th>Within ${T.reply_window_hours || 2} h</th><th>Median</th><th>Won</th><th>Lost</th><th>Won value</th><th>Commission (${(rate * 100).toFixed(2)}% of won ≥ ${peso(minv)})</th></tr>${Object.entries(byP).map(([k, p]) => { const v = p.mins.sort((a, b) => a - b), md = v[Math.floor(v.length / 2)]; return `<tr><td><b>${esc(k)}</b></td><td>${p.n}</td><td>${pct(p.within, p.n)}%</td><td>${md < 60 ? md + " min" : (md / 60).toFixed(1) + " h"}</td><td>${p.won}</td><td>${p.lost}</td><td class="num">${peso(p.value)}</td><td class="num"><b>${peso(p.comm)}</b></td></tr>`; }).join("") || "<tr><td colspan='8' class='muted'>No contacts stamped yet this month. Press \"I contacted them\" on each inquiry.</td></tr>"}</table><p class="muted small"><b>Test entries are not counted:</b> anything with the word "test" in the name, email, occasion, notes or staff notes is left out of this KPI. The stamp is automatic: the first person to move an inquiry past Pencil, or to press "I contacted them", is credited with the response time. Down payment confirmed (events) and down payment received (groups) count as won; Cancelled counts as lost. Rates come from consultant_terms.</p></div>

    ${can("C") ? `<div class="card" style="grid-column:1/-1"><h3>Blocked dates</h3><p class="muted small">Block a date or a range for events like Beyblade nights or the private-events season. Pick which booking types are blocked; types you tick under "warn only" still go through but the customer sees your note.</p>
      <table><tr><th>Dates</th><th>Branch</th><th>Blocked</th><th>Warn only</th><th>Reason / note</th><th></th></tr>${D.blocks.filter(b => b.active).map(b => `<tr><td style="white-space:nowrap">${fmt(pd(b.from_date))}${b.to_date !== b.from_date ? " – " + fmt(pd(b.to_date)) : ""}${b.to_date < iso(today) ? " <span class='muted small'>(past)</span>" : ""}</td><td>${b.branch === "all" ? "Both" : BRN[b.branch]}</td><td>${(b.kinds || []).map(k => `<span class="chip c-Lost">${KINDL[k]}</span>`).join(" ") || "<span class='muted'>—</span>"}</td><td>${(b.note_kinds || []).map(k => `<span class="chip c-Pencil">${KINDL[k]}</span>`).join(" ") || "<span class='muted'>—</span>"}</td><td><b>${esc(b.reason || "")}</b>${b.note ? `<br><span class="small muted">${esc(b.note)}</span>` : ""}</td><td>${isHr ? `<button class="btn sm ghost" onclick="cancelBlock('${b.id}')">Cancel block</button>` : ""}</td></tr>`).join("") || "<tr><td colspan='6' class='muted'>No active blocks.</td></tr>"}</table>
      ${isHr ? `<div class="fields" style="margin-top:12px"><label class="f">From<input id="bk-from" type="date" value="${iso(today)}"></label><label class="f">To<input id="bk-to" type="date" value="${iso(today)}"></label><label class="f">Branch<select id="bk-br"><option value="all">Both branches</option>${Object.entries(BRN).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label><label class="f">Reason (shown to customers)<input id="bk-reason" placeholder="Beyblade tournament"></label></div>
      <div style="display:flex;gap:24px;flex-wrap:wrap;margin:8px 0"><div><div class="small muted" style="font-weight:700">Block</div>${Object.entries(KINDL).map(([k, l]) => `<label style="display:block"><input type="checkbox" class="bk-kind" value="${k}"> ${l}</label>`).join("")}</div><div><div class="small muted" style="font-weight:700">Warn only (still bookable, shows the note)</div>${Object.entries(KINDL).map(([k, l]) => `<label style="display:block"><input type="checkbox" class="bk-note" value="${k}"> ${l}</label>`).join("")}</div></div>
      <label class="f">Note shown to warned bookings<textarea id="bk-note" rows="2" placeholder="Your table is confirmed but may be cancelled if the venue is booked for an event; please check our Facebook page on the day."></textarea></label><button class="btn sm primary" style="margin-top:10px" onclick="addBlock()">Add block</button>` : ""}</div>` : ""}
    ${can("I") ? `<div class="card"><h3>Branches</h3>${D.branches.map(b => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(b.name)}</b> · ${String(b.open_time).slice(0, 5)}–${String(b.close_time).slice(0, 5)}<br><span class="muted small">Tables: ${Object.entries(b.areas).map(([a, n]) => a + " " + n).join(", ")} · event minimums eve ${b.rates.eve.map(peso).join(" / ")}, aft ${b.rates.aft.map(peso).join(" / ")}</span></div>`).join("")}<p class="muted small">Table counts and event rates are edited in the Supabase table "branches" for now.</p></div>` : ""}
    ${sw("I5") ? `<div class="card"><h3>Backup</h3><p class="muted small">Downloads every table (bookings, events, employees, schedules, punches, payroll, settings) as one file you can keep. Do this before any big change and once a week.</p><button class="btn sm" onclick="backupAll()">Download backup</button></div>` : ""}
    <div class="card"><h3>My password</h3><p class="muted small">Signed in as ${esc(me.email)}.</p><div class="fields"><label class="f">New password (8+ characters)<input id="pw1" type="password" autocomplete="new-password"></label><label class="f">Repeat<input id="pw2" type="password" autocomplete="new-password"></label></div><button class="btn sm" onclick="changePw()">Change password</button></div>
    ${can("I") || admin ? `<div class="card" style="grid-column:1/-1"><h3>Portal users &amp; access</h3><p class="muted small">Each person gets a role preset, then you can fine-tune what they see (view) and what they can change (edit) per area. Owners always have everything.</p><table><tr><th>Person</th><th>Role</th><th>Access</th>${admin ? "<th></th>" : ""}</tr>${D.staff.map(s => { const p = permsOf(s); return `<tr><td><b>${esc(s.name || "")}</b><br><span class="muted small">${esc(s.email)}</span></td><td><span class="role-chip">${esc(ROLE_NAMES[s.role] || s.role)}</span></td><td class="small">${s.role === "owner" ? "Full access" : PERM_CATS.filter(([k]) => p[k] !== "none").map(([k, l]) => `${({A:"Bookings",B:"Events",C:"Calendar",D:"Marketing",E:"Playbook",S:"Seating",F:"HR people",G:"HR time",H:"Payroll",I:"Settings"})[k]} <span class="muted">${p[k]}</span>`).join(" · ") || "<span class='muted'>nothing yet</span>"}</td>${admin ? `<td style="white-space:nowrap"><button class="btn sm ghost" onclick="editAccess('${s.id}')">Access</button> <button class="btn sm ghost" onclick="rmStaff('${s.id}')">Remove</button></td>` : ""}</tr>`; }).join("")}</table>
      ${admin ? `<div class="fields" style="margin-top:10px"><label class="f">Name<input id="st-name"></label><label class="f">Email<input id="st-email" type="email"></label><label class="f">Role<select id="st-role">${Object.entries(ROLE_NAMES).filter(([k]) => k !== "owner" || myRole === "owner").map(([k, n]) => `<option value="${k}">${n}</option>`).join("")}</select></label></div><button class="btn sm" onclick="addStaff()">Add person</button><p class="muted small">Presets: <b>Owner</b> and <b>Executive assistant</b> have everything. <b>Manager</b> runs bookings, events, marketing and HR and prepares payroll (the owner approves it). <b>Marketing associate</b> handles bookings, events, calendar, marketing and the playbook, plus backups. <b>Cashier · branch portal</b> sees bookings and runs table seating. <b>Consultant</b> works events and sees only their own KPI line. After adding someone, click Access to adjust, then invite them under Authentication → Users in Supabase (or they can use "Email me a sign-in link").</p>` : ""}</div>` : ""}</div>`; }
function editAccess(id){ const s = D.staff.find(x => x.id === id); if (!s) return; if (s.role === "owner" && myRole !== "owner") return toast("Only an owner can change an owner account"); let role = s.role, p = { ...permsOf(s) };
  const draw = () => { const locked = role === "owner"; $("#modal-in").innerHTML = `<h2>${esc(s.name || s.email)}</h2><p class="muted small">${esc(s.email)}</p>
    <div class="fields"><label class="f">Role preset<select id="ac-role" ${myRole !== "owner" && role === "owner" ? "disabled" : ""}>${Object.entries(ROLE_NAMES).filter(([k]) => k !== "owner" || myRole === "owner").map(([k, n]) => `<option value="${k}" ${role === k ? "selected" : ""}>${n}</option>`).join("")}</select></label><div style="align-self:end"><button class="btn sm ghost" id="ac-reset">Reset to preset</button></div></div>
    ${locked ? `<p class="muted">Owners always have full access.</p>` : `<h3 style="margin-top:14px">Areas</h3><div class="perm-grid">${PERM_CATS.map(([k, l]) => `<div>${l}</div><div class="lv">${["none","view","edit"].map(v => `<button aria-pressed="${p[k] === v}" data-k="${k}" data-v="${v}">${v}</button>`).join("")}</div>`).join("")}</div>
    <h3 style="margin-top:16px">Special rights</h3><div style="display:grid;gap:6px">${PERM_SW.map(([k, l]) => `<label><input type="checkbox" class="ac-sw" value="${k}" ${p[k] ? "checked" : ""}> ${l}</label>`).join("")}</div>`}
    <div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost keep" onclick="closeModal()">Cancel</button><button class="btn primary" id="ac-save">Save access</button></div>`;
    $("#ac-role").onchange = e => { role = e.target.value; p = { ...(ROLE_PRESETS[role] || ROLE_PRESETS.events) }; draw(); };
    $("#ac-reset").onclick = () => { p = { ...(ROLE_PRESETS[role] || ROLE_PRESETS.events) }; draw(); };
    document.querySelectorAll(".perm-grid .lv button").forEach(b => b.onclick = () => { p[b.dataset.k] = b.dataset.v; draw(); });
    document.querySelectorAll(".ac-sw").forEach(c => c.onchange = () => { p[c.value] = c.checked; });
    $("#ac-save").onclick = async () => { const { error } = await sb.from("staff").update({ role, perms: role === "owner" ? null : p }).eq("id", s.id); if (error) return toast(error.message); closeModal(); await load(); render(); toast("Access saved"); }; };
  openModal(""); draw(); }
/* ---------- table seating (coming soon) ---------- */
let seatBr = "ju";
function seat(){ ro("S"); const edit = can("S", "edit");
  $("#main").innerHTML = `<h1>Table seating<span class="soon">Coming soon</span></h1><p class="muted" style="max-width:70ch">This is where the branch team will see tonight's bookings on the floor map and seat, move or clear tables. ${edit ? "You'll have seating controls here." : "You'll have view access here."} For now, here is the blueprint.</p>
  <div class="tabs">${[["ju","Jupiter Street"],["sa","San Antonio Place"]].map(([k, n]) => `<button aria-pressed="${seatBr === k}" onclick="seatBr='${k}';seat()">${n}</button>`).join("")}</div>
  ${seatBr === "ju" ? `<div class="card" style="max-width:720px;background:#000;padding:0;overflow:hidden"><img src="floor-jupiter.png" alt="Jupiter Street floor map, 42 pax" style="display:block;width:100%;height:auto"></div><p class="muted small" style="margin-top:8px">Jupiter Street · 42 pax · 3 four-seaters by the projector/karaoke wall, 2 six-seaters in the middle, 3 four-seaters by the couch. Bar, arcade, kitchen and restroom marked.</p>` : `<div class="card empty" style="max-width:720px">San Antonio Place blueprint not uploaded yet.</div>`}`; }
async function saveSetting(key, fields, numeric){ const base = D.settings[key] || {}; const v = { ...base }; fields.forEach(f => { const el = $(`#s-${key === "reservation" ? f : key + "-" + f}`); v[f] = numeric ? +el.value : el.value; });
  const { error } = await sb.from("settings").upsert({ key, value: v }); if (error) return toast(error.message); D.settings[key] = v; toast("Saved"); }
async function backupAll(){ const tables = ["bookings","inquiries","activity","settings","branches","staff","content_posts","content_checklist","enquiry_log","consultant_terms","employees","schedules","punches","attendance_exceptions","holidays","leaves","payroll_runs","payroll_lines","timesheet_imports"]; const out = { exported_at: new Date().toISOString(), by: me.email, tables: {} };
  for (const t of tables){ const { data, error } = await sb.from(t).select("*"); out.tables[t] = error ? { error: error.message } : data; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" })); a.download = `catchinup-backup-${iso(new Date())}.json`; a.click(); toast("Backup downloaded"); }
async function savePayment(){ const v = { ...(D.settings.payment || {}) }; ["sa","ju"].forEach(b => { v[b] = { ...(v[b] || {}), gcash_name: $(`#s-pay-${b}-gcash_name`).value.trim(), maya_name: $(`#s-pay-${b}-maya_name`).value.trim(), bank_name: $(`#s-pay-${b}-bank_name`).value.trim() }; }); delete v.gcash; delete v.bank;
  const { error } = await sb.from("settings").upsert({ key: "payment", value: v }); if (error) return toast(error.message); D.settings.payment = v; toast("Saved"); }
async function uploadQr(b, k, input){ const f = input.files[0]; if (!f) return; toast("Uploading…"); const path = `qr/${b}-${k}.${(f.name.split(".").pop() || "png").toLowerCase()}`;
  const { error } = await sb.storage.from("assets").upload(path, f, { upsert: true, contentType: f.type }); if (error) return toast(error.message);
  const { data } = sb.storage.from("assets").getPublicUrl(path); const v = { ...(D.settings.payment || {}) }; v[b] = { ...(v[b] || {}), [k]: data.publicUrl };
  const r = await sb.from("settings").upsert({ key: "payment", value: v }); if (r.error) return toast(r.error.message); D.settings.payment = v; toast("QR saved"); render(); }
async function addBlock(){ const kinds = [...document.querySelectorAll(".bk-kind:checked")].map(x => x.value), note_kinds = [...document.querySelectorAll(".bk-note:checked")].map(x => x.value); if (!kinds.length && !note_kinds.length) return toast("Tick at least one booking type"); if (!$("#bk-from").value || !$("#bk-to").value) return toast("Pick the dates");
  const { error } = await sb.from("booking_blocks").insert({ from_date: $("#bk-from").value, to_date: $("#bk-to").value, branch: $("#bk-br").value, kinds, note_kinds, reason: $("#bk-reason").value.trim() || null, note: $("#bk-note").value.trim() || null, created_by: me.email }); if (error) return toast(error.message); await logAct("BLOCK", `${$("#bk-from").value}–${$("#bk-to").value} ${kinds.join("/")} blocked: ${$("#bk-reason").value}`); await load(); render(); toast("Block added"); }
async function cancelBlock(id){ if (!confirm("Cancel this block? Bookings on those dates open again.")) return; const { error } = await sb.from("booking_blocks").update({ active: false }).eq("id", id); if (error) return toast(error.message); await load(); render(); toast("Block cancelled"); }
async function saveRules(){ const v = { ...(D.settings.reservation || {}), friday_tables_blocked: $("#s-rule-friday").value === "true" };
  const { error } = await sb.from("settings").upsert({ key: "reservation", value: v }); if (error) return toast(error.message); D.settings.reservation = v; toast("Rules saved"); }
async function changePw(){ const a = $("#pw1").value, b = $("#pw2").value; if (a.length < 8) return toast("Use at least 8 characters"); if (a !== b) return toast("Passwords don't match"); const { error } = await sb.auth.updateUser({ password: a }); if (error) return toast(error.message); $("#pw1").value = $("#pw2").value = ""; toast("Password changed"); }
async function addStaff(){ const role = $("#st-role").value; const { error } = await sb.from("staff").insert({ name: $("#st-name").value, email: $("#st-email").value.trim().toLowerCase(), role, perms: role === "owner" ? null : ROLE_PRESETS[role] }); if (error) return toast(error.message); await load(); render(); toast("Added. Click Access to fine-tune."); }
async function rmStaff(id){ if (!confirm("Remove this staff member's access?")) return; const { error } = await sb.from("staff").delete().eq("id", id); if (error) return toast(error.message); await load(); render(); }

start();
</script>
<script src="hr.js"></script>
<script src="playbook.js"></script>

<div class="sl-bg" id="sl"><div class="sl" id="sl-in"></div></div><button class="fb-pill" id="fb-pill" hidden>Feedback</button>
<script>
(function(){ const bg = document.getElementById("sl"), box = document.getElementById("sl-in"), pill = document.getElementById("fb-pill"), KEY = "cu-portal-softlaunch-v1";
  function notice(){ box.innerHTML = `<span class="tag">Soft launch</span><h3>The portal is live, and still settling in.</h3><p>Bookings, events, the response KPI, HR and payroll should all work the way we planned. While we soft-launch, anything that feels slow, confusing or wrong is worth a note; use the Feedback button at the bottom right any time. Your comments shape what gets fixed first.</p><div class="row"><button class="b" id="sl-fb">Send feedback</button><button class="b p" id="sl-ok">Got it</button></div>`;
    bg.classList.add("open"); document.getElementById("sl-ok").onclick = close; document.getElementById("sl-fb").onclick = form; }
  function form(){ box.innerHTML = `<span class="tag">Feedback</span><h3>What should we fix or add?</h3><p>Which page, what you expected, what happened. Screenshots can go to the group chat.</p><textarea id="fb-msg" rows="4" placeholder="Tell us…"></textarea><div class="row"><button class="b" id="fb-cancel">Close</button><button class="b p" id="fb-send">Send</button></div><p id="fb-msgline" style="margin-top:8px"></p>`;
    bg.classList.add("open"); document.getElementById("fb-cancel").onclick = close;
    document.getElementById("fb-send").onclick = async () => { const m = document.getElementById("fb-msg").value.trim(); const line = document.getElementById("fb-msgline"); if (m.length < 3) { line.textContent = "Please write a few words first."; return; } line.textContent = "Sending…";
      try { const cfg = window.CU_CONFIG || {}; const r = await fetch(cfg.ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json", apikey: cfg.ANON_KEY || "", Authorization: "Bearer " + (cfg.ANON_KEY || "")}, body: JSON.stringify({type:"feedback", source:"portal", page: "manage/" + (typeof page !== "undefined" ? page : ""), message: m, name: (typeof me !== "undefined" && me && me.email) || "", contact: (typeof me !== "undefined" && me && me.email) || "", version: cfg.VERSION})}); const j = await r.json(); if (!j.ok) throw new Error(j.error || "failed");
        box.innerHTML = `<span class="tag">Thank you</span><h3>Noted.</h3><p>It goes straight to the owner's inbox and is kept in the feedback list.</p><div class="row"><button class="b p" id="fb-done">Close</button></div>`; document.getElementById("fb-done").onclick = close; }
      catch (e) { line.textContent = "Couldn't send right now. Drop it in the group chat instead."; } }; }
  function close(){ bg.classList.remove("open"); try { localStorage.setItem(KEY, "1"); } catch (e) {} pill.hidden = false; }
  bg.onclick = e => { if (e.target === bg) close(); }; pill.onclick = form;
  let seen = false; try { seen = !!localStorage.getItem(KEY); } catch (e) {}
  window.showSoftLaunch = () => { if (seen) { pill.hidden = false; return; } setTimeout(notice, 500); };
})();
</script>
