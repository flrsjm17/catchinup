<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Catchin' Up · Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="icon.png">
<style>
/* ===== Catchin' Up portal · design system v2 =====
   Spacing scale: 4 · 8 · 12 · 16 · 24 · 32   Radius: 8 controls · 12 containers
   Type: 12 meta · 13 small · 14 body/table · 15 base · 18 section · 24 page */
:root{--ink:#161616;--muted:#5e5e5e;--faint:#8a8a8a;--line:#e6e6e6;--soft:#f6f6f6;--hover:#fafafa;--accent:#1f7a8c;--green:#1f9d55;--amber:#8a5a00;--amber-bg:#fff6e3;--red:#c62828;--card:#fff;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r-sm:8px;--r:12px;--ctl:38px;--side:240px}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;margin:0 0 var(--s2);font-weight:600;letter-spacing:-.01em}
h1{font-size:24px;line-height:1.2}h2{font-size:20px}h3{font-size:15px;font-weight:700}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.small{font-size:13px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* buttons: one shape, three weights */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--ctl);border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:0 16px;font-weight:700;font-size:14px;line-height:1.2;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--soft)}
.btn.primary{background:var(--ink);color:#fff}.btn.primary:hover:not(:disabled){background:#333}
.btn.ghost{border-color:var(--line)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* inputs */
input,select,textarea{font:inherit;font-size:14px;min-height:var(--ctl);padding:7px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--ink)}
textarea{min-height:auto}input[type=checkbox],input[type=radio]{min-height:0;width:16px;height:16px;accent-color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(22,22,22,.08)}
input:disabled,select:disabled,textarea:disabled{background:var(--soft);color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:var(--s1);font-size:13px;font-weight:600;color:var(--muted)}label.f>*{font-weight:400;color:var(--ink)}

/* shell */
.app{display:flex;min-height:100vh}
.side{width:var(--side);flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:#0b0b0e;color:#efe9e1;display:flex;flex-direction:column;padding:var(--s4) var(--s3)}
.side .brand{display:flex;align-items:center;gap:10px;padding:var(--s1) var(--s2) var(--s4);font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:15px;line-height:1.15;color:#efe9e1;white-space:nowrap}.side .brand img{height:32px;width:32px;border-radius:8px}.side .brand span{display:block;font-weight:500;font-size:11px;color:#8a8278;letter-spacing:.08em;text-transform:uppercase}
.side nav{display:flex;flex-direction:column;gap:2px}
.nav-grp{display:flex;flex-direction:column;gap:2px;margin-bottom:var(--s3)}
.nav-sec{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6f6a63;padding:var(--s2) var(--s3) var(--s1)}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;min-height:38px;text-align:left;background:transparent;border:0;padding:0 var(--s3);border-radius:var(--r-sm);font-weight:600;font-size:14px;color:#b9b2a8;transition:transform .15s,background .15s,color .15s}
.side nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side nav button .nb{margin-left:auto;background:#ff9f1a;color:#0b0b0e;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.side nav button:hover{background:#1a1a20;color:#fff;transform:scale(1.03)}
.side nav button[aria-current=page]{background:#efe9e1;color:#0b0b0e}
.side .bottom{margin-top:auto;border-top:1px solid #222228;padding:var(--s3) var(--s2) 0;font-size:12px;color:#8a8278;display:flex;flex-direction:column;gap:var(--s2)}
.side .bottom .who{display:flex;flex-direction:column;gap:var(--s1);overflow:hidden;text-overflow:ellipsis}
.side .bottom .row2{display:flex;gap:var(--s2)}.side .bottom .btn{flex:1;border-color:#2a2a30;background:transparent;color:#efe9e1}.side .bottom .btn:hover{background:#1a1a20}
.wrap{flex:1;min-width:0;max-width:1200px;padding:var(--s5) var(--s6) 64px}
.topbar,.tabbar,.scrim{display:none}

/* page header: title left, page controls right */
.ph{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--s3);margin:0 0 var(--s4)}.ph h1{margin:0}.ph .toolbar{margin:0}
.ph-sub{color:var(--muted);font-size:14px;margin:-12px 0 var(--s4)}
#main>h1:first-child{margin-bottom:var(--s4)}

/* tabs: underline, never look like buttons */
.tabs{display:flex;gap:var(--s1);margin:0 0 var(--s4);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-bottom:2px solid transparent;background:transparent;border-radius:0;padding:10px 12px;margin-bottom:-1px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .step{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--soft);font-size:11px;font-weight:700;color:var(--muted)}.tabs button[aria-pressed=true] .step{background:var(--ink);color:#fff}
.tabs .chip{font-size:11px;padding:1px 7px}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;margin:0 0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--soft)}
.tabs-x{display:flex;gap:var(--s2);margin:-8px 0 var(--s4);flex-wrap:wrap}

/* containers */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s4);align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.card>h3:first-child{margin-bottom:var(--s3)}
.span2{grid-column:span 2}
.dash-grid{grid-template-columns:2fr 1fr}.dash-grid>.card:nth-child(2){order:-1;grid-column:1;grid-row:1 / span 2}
@media(max-width:1100px){.dash-grid{grid-template-columns:1fr}.dash-grid>.card:nth-child(2){grid-row:auto}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s3);margin:0 0 var(--s5)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4)}
.kpi[onclick]{cursor:pointer;transition:border-color .15s,background .15s}.kpi[onclick]:hover{border-color:var(--ink);background:var(--hover)}
.kpi .v{font-family:"Space Grotesk",sans-serif;font-size:24px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}.kpi .l{font-size:13px;color:var(--muted);margin-top:2px}
.kpi .bar{height:4px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:var(--s2)}.kpi .bar i{display:block;height:100%;background:var(--accent)}
.toolbar{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin:0 0 var(--s3)}
.toolbar input:not([type]),.toolbar input[type=text],.toolbar input[type=search]{min-width:220px}
.empty{color:var(--muted);padding:var(--s5) var(--s4);text-align:center;font-size:14px}
.list-row{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.list-row:last-child{border-bottom:0}.list-row:hover{background:var(--hover)}

/* tables: scan first */
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
tr:last-child>td{border-bottom:0}
th{background:var(--soft);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);vertical-align:bottom}
td.num,th.num{text-align:right}
tr.row{cursor:pointer}tr.row:hover td{background:var(--hover)}
.card table{border:0;border-radius:0}.card th{background:transparent}.card td:first-child,.card th:first-child{padding-left:0}.card td:last-child,.card th:last-child{padding-right:0}

/* status */
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.5}
.c-New,.c-Booked{background:#eef6f8;color:#0f5f6c}.c-Seated{background:#eeeeee;color:#333}
.c-Pencil{background:#ffe88a;color:#5c4500}.c-Contacted{background:#ffc98a;color:#7a3a00}.c-Proposal{background:#dccbff;color:#3f2387}.c-SOA{background:#bcd8ff;color:#0b3d91}.c-Down,.c-Deposit,.c-Confirmed{background:#9fe0b6;color:#0f4d26}.c-Cancelled,.c-Lost{background:#ffb3b3;color:#8a1111}.c-Rescheduled{background:#ffc2ec;color:#8a1e6c}.c-No-show{background:#f1f1f1;color:#777}
.p-Pencil{background:#ffe88a;color:#5c4500}.p-Contacted{background:#ffb060;color:#4a2300}.p-Proposal{background:#c4a8ff;color:#2b1466}.p-SOA{background:#8fc0ff;color:#0b3d91}.p-Down{background:#4ccc7a;color:#0f3d1f}.p-Cancelled{background:#ff8a8a;color:#5a0b0b;text-decoration:line-through}.p-Rescheduled{background:#ff9ee0;color:#5a1245}
.role-chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#eef6f8;color:#0f5f6c}
.soon{display:inline-block;background:#ff70e8;color:#0b0b0e;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-left:8px;vertical-align:middle}
.ro-badge{display:none;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8a5a00;background:#fff6e3;border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle}body.ro .ro-badge{display:inline-block}
body.ro #main .btn:not(.keep),body.ro .modal .btn:not(.keep),body.ro #main .actions:not(.keep),body.ro .modal .actions:not(.keep){display:none!important}
body.ro .modal select,body.ro .modal textarea,body.ro .modal input[type=checkbox],body.ro #main input[type=file],body.ro #main textarea{pointer-events:none;opacity:.6}
body.ro .modal h3:has(+ .actions:not(.keep)){display:none}
.perm-grid{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:14px}.perm-grid .lv{display:flex;gap:4px}.perm-grid .lv button{border:1px solid var(--line);background:#fff;border-radius:999px;min-height:30px;padding:0 10px;font-size:12px;font-weight:700}.perm-grid .lv button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* event pipeline */
.pipe{display:grid;gap:0;margin:10px 0 4px}.pstep{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:8px 0;position:relative}
.pstep .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 12px "Space Grotesk",sans-serif;color:var(--muted);background:#fff;position:relative;z-index:1}
.pstep:not(:last-child):before{content:"";position:absolute;left:12px;top:36px;bottom:-8px;width:2px;background:var(--line)}
.pstep.done .dot{background:var(--green);border-color:var(--green);color:#fff}.pstep.now .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.pstep .t{font-weight:700}.pstep.next .t{color:var(--muted);font-weight:600}.pstep .s{font-size:13px;color:var(--muted)}.pstep .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pstep.now{background:var(--soft);border-radius:var(--r);padding:10px 10px 12px;margin:2px -10px}.pstep.now:before{left:22px}
.check{display:grid;gap:8px;margin:8px 0 14px}.check label{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer}.check label input{margin-top:3px}
.soa-only{display:none}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px}
.day{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);min-height:96px;padding:6px;font-size:12px;cursor:pointer;min-width:0;transition:border-color .15s,background .15s}
.day:hover{border-color:var(--ink);background:var(--hover)}
.day.off{opacity:.45}.day.today{outline:2px solid var(--accent);outline-offset:-1px}.day .d{font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between}
.pill{border-radius:6px;padding:3px 6px;margin-top:3px;font-size:11px;line-height:1.3;white-space:normal;overflow:hidden;word-break:break-word}
.p-pub{background:var(--green);color:#fff}.p-ok{background:#bfe8cf;color:#115a30}.p-wait{border:1.5px dashed #d98e04;color:#7a5000}.p-plan{background:var(--soft);color:var(--muted)}
.p-res{background:#eef6f8;color:#0f5f6c}.p-ev{background:var(--ink);color:#fff}.p-evp{border:1.5px dashed var(--ink);color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:0 0 var(--s3);color:var(--muted)}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}

.wf-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}.wf-side{position:sticky;top:12px;max-height:calc(100vh - 40px);overflow:auto}
.day.wf-sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.wf-n{display:flex;align-items:center;gap:5px;font-size:11.5px;margin-top:3px;color:var(--muted)}.wf-c{min-width:20px;height:18px;border-radius:5px;display:inline-grid;place-items:center;font-weight:700;font-size:11px;font-variant-numeric:tabular-nums;padding:0 4px}
.wf-w{background:#dff3e6;color:#115a30}.wf-o{background:var(--soft);color:var(--muted)}.wf-l{background:#e6ecfb;color:#2b4a9a}.wf-s{background:#fde3e3;color:#a22020}.wf-p{background:#fff3df;color:#8a5a00}
.legend i.wf-w,.legend i.wf-o,.legend i.wf-l,.legend i.wf-s,.legend i.wf-p,.wf-gt i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.wf-grp{margin:0 0 12px}.wf-gt{font-weight:700;font-size:13px;margin-bottom:4px}.wf-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}.wf-row>span:last-child{text-align:right;color:var(--muted)}
@media(max-width:960px){.wf-wrap{grid-template-columns:1fr}.wf-side{position:static;max-height:none}.wf-n span:last-child{display:none}.wf-n{justify-content:center}}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:var(--s5)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px;margin:var(--s3) 0}.kv b{color:var(--muted);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:var(--s3) 0}
.timeline{border-left:2px solid var(--line);margin:8px 0 0 6px;padding-left:14px;font-size:13px}.timeline div{margin-bottom:6px}
.load{display:grid;grid-template-columns:repeat(auto-fit,minmax(36px,1fr));gap:4px;margin:6px 0 12px}
.load div{text-align:center;font-size:11px;border-radius:6px;padding:4px 2px;background:var(--soft)}.load b{display:block;font-size:13px}
.login{max-width:400px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}
.prog{height:6px;background:var(--soft);border-radius:999px;overflow:hidden}.prog i{display:block;height:100%;background:var(--green)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:95;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}.toast.show{opacity:1}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s3);margin:var(--s3) 0}
pre.sum{white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace;background:var(--soft);border-radius:10px;padding:10px;max-height:40vh;overflow:auto}
@media print{.soa-only{display:block}.side,.topbar,.tabbar,.tabs,.toolbar,.actions,button{display:none!important}.wrap{max-width:none;padding:0}body{font-size:12px}}

/* ===== tablet ===== */
@media(max-width:1100px){.wrap{padding:var(--s5) var(--s5) 64px}.span2{grid-column:auto}}

/* ===== phone: app shell, not a shrunken desktop ===== */
@media(max-width:860px){
  :root{--ctl:44px}
  .btn.sm{min-height:38px}
  .app{display:block}
  .topbar{display:flex;position:sticky;top:0;z-index:40;align-items:center;gap:10px;height:56px;padding:0 var(--s3);background:#0b0b0e;color:#efe9e1}
  .topbar img{width:30px;height:30px;border-radius:8px}.topbar b{font:700 17px "Space Grotesk",sans-serif;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar button{background:transparent;border:0;color:#efe9e1;width:44px;height:44px;display:grid;place-items:center;border-radius:10px}.topbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .side{position:fixed;top:0;left:0;bottom:0;height:auto;z-index:80;width:min(300px,86vw);transform:translateX(-102%);transition:transform .22s ease;padding-top:var(--s5)}
  body.drawer .side{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}body.drawer .scrim{opacity:1;pointer-events:auto}
  .side nav button{min-height:44px;font-size:15px}.side nav button:hover{transform:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:0;min-height:52px;font-size:11px;font-weight:600;color:var(--faint);border-radius:10px;padding:6px 2px}
  .tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button[aria-current=page]{color:var(--ink)}.tabbar button[aria-current=page] svg{stroke-width:2.3}
  .wrap{padding:var(--s4) var(--s4) 96px}
  h1{font-size:22px}
  .ph{align-items:flex-start}
  .grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr;gap:var(--s2);margin-bottom:var(--s4)}.kpi{padding:var(--s3)}.kpi .v{font-size:20px}
  .toolbar{gap:var(--s2)}.toolbar>input,.toolbar>select,.toolbar input:not([type]){flex:1 1 140px;min-width:0}
  .fields{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:0 0}.kv b{margin-top:8px}
  .modal-bg{align-items:flex-end;padding:0}.modal{border-radius:16px 16px 0 0;max-height:94vh;padding:var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom))}
  .actions .btn{flex:1 1 auto}
  /* tables become stacked records */
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt{border:0;background:transparent;border-radius:0;overflow:visible}
  table.rt tr.hd{display:none}
  table.rt tr{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s3);margin-bottom:var(--s2)}
  .card table.rt tr{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:var(--s2) 0;margin:0}
  table.rt td{border:0;padding:3px 0 3px 38%;position:relative;text-align:left!important;min-height:24px}

<script>
const CFG = window.CU_CONFIG || {};
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const chip = s => s ? `<span class="chip c-${String(s).split(" ")[0]}">${esc(s)}</span>` : "";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const BRN = {sa:"San Antonio Place", ju:"Jupiter Street"};
const SLOTN = {aft:"Afternoon 1–5 PM", eve:"Evening 7–11 PM"};
function toast(t){ const e = $("#toast"); e.textContent = t; e.classList.add("show"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("show"), 2400); }
const pd = v => { if (!v) return null; const m = String(v).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(v); };
const iso = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}` : "";
const fmt = d => d ? d.toLocaleDateString("en-PH", {weekday:"short", month:"short", day:"numeric"}) : "";
const fmtTs = v => v ? new Date(v).toLocaleString("en-PH", {month:"short", day:"numeric", hour:"numeric", minute:"2-digit"}) : "";
const ampm = t => { const m = String(t || "").match(/(\d{1,2}):(\d{2})/); if (!m) return t || ""; const h = +m[1]; return `${h % 12 || 12}:${m[2]} ${h < 12 ? "AM" : "PM"}`; };
const today = new Date(); today.setHours(0, 0, 0, 0);
let D = {bookings:[], inquiries:[], activity:[], posts:[], checklist:[], log:[], staff:[], settings:{}, terms:{}, branches:[], blocks:[], leads:[]}, page = "dash", cur = {y: today.getFullYear(), m: today.getMonth()}, me = null, myRole = "events", P = {}, pageRo = false;
/* ---------- roles & access ---------- */
const PERM_CATS = [["A","Bookings (tables & big groups)"],["B","Private events (inquiries)"],["C","Calendar & blocked dates"],["D","Marketing"],["E","Playbook"],["S","Table seating (branch)"],["F","HR · people"],["G","HR · time & attendance"],["H","Payroll"],["I","Settings"]];

const FULL = {A:"edit",B:"edit",C:"edit",D:"edit",E:"edit",F:"edit",G:"edit",H:"edit",I:"edit",S:"edit",C3:true,D2:false,D4:true,H3:true,H4:true,I4:true,I5:true};
const ROLE_PRESETS = {
  owner: FULL, executive_assistant: FULL,
  manager: {A:"edit",B:"edit",C:"edit",D:"edit",E:"edit",F:"edit",G:"edit",H:"edit",I:"view",S:"edit",C3:false,D2:false,D4:true,H3:false,H4:false,I4:false,I5:false},
  marketing_associate: {A:"edit",B:"edit",C:"edit",D:"edit",E:"edit",F:"none",G:"none",H:"none",I:"none",S:"view",C3:false,D2:false,D4:false,H3:false,H4:false,I4:false,I5:true},
  cashier: {A:"view",B:"none",C:"none",D:"none",E:"none",F:"none",G:"none",H:"none",I:"none",S:"edit",C3:false,D2:false,D4:false,H3:false,H4:false,I4:false,I5:false},
  consultant: {A:"view",B:"edit",C:"view",D:"view",E:"view",F:"none",G:"none",H:"none",I:"none",S:"none",C3:false,D2:true,D4:false,H3:false,H4:false,I4:false,I5:false},
  events: {A:"edit",B:"edit",C:"view",D:"view",E:"view",F:"none",G:"none",H:"none",I:"none",S:"none",C3:false,D2:false,D4:false,H3:false,H4:false,I4:false,I5:false} };
const ROLE_NAMES = { owner:"Owner", executive_assistant:"Executive assistant", manager:"Manager", marketing_associate:"Marketing associate", cashier:"Cashier · branch portal", events:"Events", consultant:"Consultant" };
const permsOf = s => s.role === "owner" ? FULL : { ...(ROLE_PRESETS[s.role] || ROLE_PRESETS.events), ...(s.perms || {}) };
const can = (k, lvl) => lvl === "edit" ? P[k] === "edit" : (P[k] === "view" || P[k] === "edit");
const sw = k => P[k] === true;
const HR_GRP = { people: { title: "People", tabs: [["emps", "Employees"]] }, schedule: { title: "Schedule", tabs: [["lineup", "Line-up"], ["floorplan", "Floor plan"], ["hol", "Holidays & leave"]] }, pay: { title: "Time & pay", tabs: [["time", "Timesheets", 1], ["exc", "Exceptions", 2], ["pay", "Payroll", 3], ["rules", "Rules"]] }, wf: { title: "Workforce Management", tabs: [["wfcal", "Team calendar"], ["wfreq", "Requests"], ["wffeed", "Live feed & chat"], ["wfann", "Announcements"], ["wflab", "Labor vs sales"], ["wfrec", "Employee file"]] }, ops: { title: "Operations", tabs: [["opsinv", "Inventory log"], ["opstoilet", "Toilet audits"], ["opshud", "Daily huddles"], ["opsrcv", "Receiving"]] } };
const HR_GRP_PERM = { people: () => can("F"), schedule: () => can("G"), pay: () => can("G") || can("H"), wf: () => can("G"), ops: () => can("G") };
const navOk = b => b.dataset.g ? HR_GRP_PERM[b.dataset.g]() : PAGE_PERM[b.dataset.p]();
const NAV_TITLE = { dash: "Today", book: "Bookings", inq: "Events", cal: "Calendar", seat: "Table seating", mkt: "Marketing", pb: "Playbook", set: "Settings" };
let hrGrp = null;
function go(p, g){ page = p; if (p === "hr"){ hrGrp = g || hrGrp; if (window.H && hrGrp && !HR_GRP[hrGrp].tabs.some(([k]) => k === H.tab)) H.tab = HR_GRP[hrGrp].tabs.find(([k]) => can(HR_CAT[k]))?.[0] || HR_GRP[hrGrp].tabs[0][0]; } document.body.classList.remove("drawer"); render(); window.scrollTo(0, 0); }
function syncNav(){ const cur = b => b.dataset.p === page && (!b.dataset.g || b.dataset.g === hrGrp);
  document.querySelectorAll("#nav button, #tabbar button[data-p]").forEach(b => cur(b) ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  const more = $("#tabbar [data-more]"); if (more){ const onBar = [...document.querySelectorAll("#tabbar button[data-p]")].some(cur); onBar ? more.removeAttribute("aria-current") : more.setAttribute("aria-current", "page"); }
  $("#tb-title").textContent = page === "hr" ? (HR_GRP[hrGrp]?.title || "Team") : NAV_TITLE[page] || "Catchin' Up"; }
function buildNav(){
  document.querySelectorAll("#nav button").forEach(b => b.hidden = !navOk(b));
  document.querySelectorAll("#nav .nav-grp").forEach(g => g.hidden = !g.querySelector("button:not([hidden])"));
  const vis = [...document.querySelectorAll("#nav button:not([hidden])")], pri = ["dash", "book", "inq", "cal", "seat", "mkt", "pb", "hr", "set"];
  const bar = vis.slice().sort((a, b) => pri.indexOf(a.dataset.p) - pri.indexOf(b.dataset.p)).slice(0, vis.length > 5 ? 4 : 5);
  const tb = $("#tabbar"); tb.innerHTML = bar.map(b => `<button data-p="${b.dataset.p}"${b.dataset.g ? ` data-g="${b.dataset.g}"` : ""}>${b.querySelector("svg").outerHTML}<span>${b.querySelector("span").textContent}</span></button>`).join("") + (vis.length > 5 ? `<button data-more>${$("#menu-btn").innerHTML}<span>More</span></button>` : "");
  tb.hidden = false; tb.querySelectorAll("button[data-p]").forEach(b => b.onclick = () => go(b.dataset.p, b.dataset.g)); const m = tb.querySelector("[data-more]"); if (m) m.onclick = () => document.body.classList.add("drawer");
  const first = vis[0]; page = first.dataset.p; hrGrp = first.dataset.g || [...document.querySelectorAll("#nav button[data-g]:not([hidden])")][0]?.dataset.g || null; }
const PAGE_PERM = { dash: () => can("A"), book: () => can("A"), inq: () => can("B"), cal: () => can("C"), seat: () => can("S"), mkt: () => can("D"), pb: () => can("E"), hr: () => can("F") || can("G") || can("H"), set: () => true };
function ro(k){ pageRo = !can(k, "edit"); document.body.classList.toggle("ro", pageRo); }
function modalRo(k){ document.body.classList.toggle("ro", !can(k, "edit")); }

/* ---------- auth ---------- */
async function start(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  me = session.user;
  const { data: staff, error } = await sb.from("staff").select("*");
  if (error || !staff || !staff.length) { $("#main").innerHTML = `<div class="login"><h2>No access</h2><p class="muted">${esc(me.email)} is signed in but isn't on the staff list. Ask the owner to add you in Settings.</p><button class="btn" id="lo">Sign out</button></div>`; $("#lo").onclick = () => sb.auth.signOut().then(() => location.reload()); return; }
  D.staff = staff; const mine = staff.find(s => s.email.toLowerCase() === me.email.toLowerCase()) || { role: "events" }; myRole = mine.role || "events"; P = permsOf(mine);
  $("#who").textContent = me.email; $("#myrole").innerHTML = `<span class="role-chip">${esc(ROLE_NAMES[myRole] || myRole)}</span>`; $("#nav").hidden = false; $("#refresh").hidden = false; $("#logout").hidden = false;
  buildNav();
  await load(); render(); if (window.showSoftLaunch) showSoftLaunch();
}
function showLogin(){ $("#main").innerHTML = `<div class="login"><div class="small muted" style="letter-spacing:.08em;text-transform:uppercase">Catchin' Up</div><h2>Management sign-in</h2>
  <label class="f">Email<input id="l-email" type="email" autocomplete="username"></label><label class="f" style="margin-top:10px">Password<input id="l-pass" type="password" autocomplete="current-password"></label>
  <button class="btn primary" style="width:100%;margin-top:14px" id="l-go">Sign in</button><button class="btn ghost" style="width:100%;margin-top:8px" id="l-magic">Email me a sign-in link instead</button><div id="l-msg" class="muted small" style="margin-top:10px"></div></div>`;
  $("#l-go").onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $("#l-email").value.trim(), password: $("#l-pass").value }); if (error) $("#l-msg").textContent = error.message; else start(); };
  $("#l-magic").onclick = async () => { const { error } = await sb.auth.signInWithOtp({ email: $("#l-email").value.trim(), options: { emailRedirectTo: location.href.split("#")[0] } }); $("#l-msg").textContent = error ? error.message : "Check your inbox for the sign-in link."; }; }
$("#logout").onclick = () => sb.auth.signOut().then(() => location.reload());
$("#refresh").onclick = async () => { await load(); render(); toast("Refreshed"); };
sb.auth.onAuthStateChange((ev) => { if (ev === "SIGNED_IN" && !me) start(); });

/* ---------- data ---------- */
async function load(){
  const since = iso(new Date(today.getFullYear(), today.getMonth() - 2, 1));
  const [b, i, a, p, c, l, s, t, br, bl, ld] = await Promise.all([
    sb.from("bookings").select("*").gte("date", since).order("date").order("time"),
    sb.from("inquiries").select("*").gte("event_date", since).order("event_date"),
    sb.from("activity").select("*").order("created_at", { ascending: false }).limit(500),
    sb.from("content_posts").select("*").order("planned_date"),
    sb.from("content_checklist").select("*").order("month"),
    sb.from("enquiry_log").select("*").order("received_at", { ascending: false }),
    sb.from("settings").select("*"), sb.from("consultant_terms").select("*"), sb.from("branches").select("*"), sb.from("booking_blocks").select("*").order("from_date"), sb.from("leads").select("*").order("created_at")]);
  D.bookings = b.data || []; D.inquiries = i.data || []; D.activity = a.data || []; D.posts = p.data || []; D.checklist = c.data || []; D.log = l.data || [];
  D.settings = Object.fromEntries((s.data || []).map(r => [r.key, r.value])); D.terms = (t.data || [])[0]?.value || {}; D.branches = br.data || []; D.blocks = bl.data || []; D.leads = ld.data || [];
}
async function logAct(ref, what){ await sb.from("activity").insert({ ref, what, by_email: me.email }); }
async function setBooking(id, patch, what){ const { error } = await sb.from("bookings").update(patch).eq("id", id); if (error) return toast("Couldn't save: " + error.message); const r = D.bookings.find(x => x.id === id); Object.assign(r, patch); if (what) await logAct(r.ref, what); toast("Saved"); }
async function setInquiry(id, patch, what){ const { error } = await sb.from("inquiries").update(patch).eq("id", id); if (error) return toast("Couldn't save: " + error.message); const r = D.inquiries.find(x => x.id === id); Object.assign(r, patch); if (what) await logAct(r.ref, what); toast("Saved"); }

/* ---------- helpers ---------- */
const active = r => ["Pencil","Booked","Confirmed","Seated"].includes(r.status);
const minsBetween = (a, b) => a && b ? Math.round((new Date(b) - new Date(a)) / 60000) : null;

const EV_ST = ["Pencil","Contacted","Proposal sent","SOA sent","Down payment confirmed","Cancelled","Rescheduled"];

function labelTables(root){ root.querySelectorAll("table").forEach(t => { if (t.closest(".cal") || t.dataset.lb === "1") return; const rows = [...t.rows]; const h = rows.find(r => r.querySelector("th")); if (!h) return; t.dataset.lb = "1";
  const heads = []; [...h.cells].forEach(c => { for (let k = 0; k < (c.colSpan || 1); k++) heads.push(c.textContent.trim()); });
  if (heads.length > 12){ if (!t.parentElement.classList.contains("scrollx")){ const w = document.createElement("div"); w.className = "scrollx"; t.before(w); w.append(t); } return; } t.classList.add("rt"); h.classList.add("hd");
  rows.forEach(r => { if (r === h) return; let i = 0; [...r.cells].forEach(c => { if (c.tagName === "TD" && !c.hasAttribute("data-label") && (c.colSpan || 1) === 1) c.setAttribute("data-label", heads[i] || ""); i += c.colSpan || 1; }); });
  heads.forEach((_, i) => { const col = rows.filter(r => r !== h).map(r => r.cells[i]).filter(Boolean); if (col.length && col.every(c => c.classList.contains("num") || !c.textContent.trim())) h.cells[i] && h.cells[i].classList.add("num"); }); }); }

  <div class="kv"><b>Contact</b><span>${l.mobile ? `<a href="tel:${esc(intl(l.mobile))}" style="color:var(--ink)">${esc(l.mobile)}</a>` : "<span class='muted'>no mobile</span>"}${l.email ? " · " + esc(l.email) : ""}</span>${l.event_hint ? `<b>They asked about</b><span>${esc(l.event_hint)}</span>` : ""}<b>Their link</b><span class="small"><a href="${leadLink(l)}" target="_blank" style="color:var(--ink)">${leadLink(l)}</a> <button class="btn sm ghost" onclick="navigator.clipboard.writeText('${leadLink(l)}').then(()=>toast('Link copied'))">Copy</button></span>${l.booked_ref ? `<b>Booking</b><span><b>${esc(l.booked_ref)}</b>${inq ? ` <button class="btn sm ghost keep" onclick="showInq('${inq.id}')">Open</button>` : ""}</span>` : ""}</div>
  <h3>1 · Email</h3><div class="actions">${l.emailed_at ? `<span class="muted small">Sent ${fmtTs(l.emailed_at)}</span>` : ""}${l.email ? `<button class="btn sm ${l.emailed_at ? "ghost" : "primary"}" onclick="leadOne('${l.id}')">${l.emailed_at ? "Send again" : "Send the email"}</button>` : "<span class='muted small'>No email on file; text and call instead.</span>"}</div>
  <h3>2 · Text</h3><pre class="sum" id="ld-sms">${esc(sms)}</pre><div class="actions">${l.mobile && !l.opted_out ? `<button class="btn sm ${l.texted_at ? "ghost" : "primary"}" onclick="leadSmsOne('${l.id}')">${l.texted_at ? "Send text again" : "Send the text"}</button>` : ""}<button class="btn sm ghost" onclick="navigator.clipboard.writeText(document.getElementById('ld-sms').textContent).then(()=>toast('Message copied'))">Copy message</button>${l.mobile ? `<a class="btn sm ghost" href="sms:${esc(intl(l.mobile))}?&body=${encodeURIComponent(sms.replace(/&#39;/g, "'").replace(/&amp;/g, "&"))}">Open in SMS app</a>` : ""}<button class="btn sm ghost" onclick="leadPatch('${l.id}',{texted_at:new Date().toISOString(),status:'${["New","Emailed"].includes(l.status) ? "Texted" : l.status}'})">${l.texted_at ? "Texted ✔ " + fmtTs(l.texted_at) + (l.sms_status ? " · " + esc(l.sms_status) : "") : "Mark as texted by hand"}</button><button class="btn sm ghost" style="color:var(--red)" onclick="leadPatch('${l.id}',{opted_out:${!l.opted_out}})">${l.opted_out ? "Opted out ✔ (undo)" : "Opted out"}</button></div>
  <h3>3 · Call</h3><p class="muted small" style="margin:0 0 6px">"Hi ${esc(String(l.name).split(" ")[0])}, this is [name] from Catchin' Up! You asked us about a private event before. We're open for bookings now, and you get first pick of dates. Did you get our email or text with your link? Want me to walk you through it, or pencil-book a date for you now?"</p>
  <div class="fields"><label class="f">Outcome<select id="ld-out">${["Interested","No answer","Not interested","Called"].map(x => `<option ${l.status === x ? "selected" : ""}>${x}</option>`).join("")}</select></label><label class="f">Follow up on<input id="ld-fu" type="date" value="${l.next_follow_up || ""}"></label></div><label class="f">Call notes<textarea id="ld-notes" rows="2">${esc(l.call_notes || "")}</textarea></label>
  <div class="actions" style="justify-content:space-between;margin-top:14px"><button class="btn ghost keep" onclick="closeModal()">Close</button>${edit ? `<button class="btn primary" onclick="leadPatch('${l.id}',{called_at:new Date().toISOString(),status:document.getElementById('ld-out').value,next_follow_up:document.getElementById('ld-fu').value||null,call_notes:document.getElementById('ld-notes').value})">Save call</button>` : ""}</div>`); }
async function leadPatch(id, patch){ const { error } = await sb.from("leads").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", id); if (error) return toast(error.message); await load(); render(); leadModal(id); toast("Saved"); }
async function leadOne(id){ toast("Sending…"); const r = await notifyFn({ action: "lead_blast", ids: [id] }); if (!r) return; await load(); render(); leadModal(id); toast(r.sent ? "Email sent" : (r.fails && r.fails[0]) || "Not sent"); }
function editPost(id, date){ const p = D.posts.find(x => x.id === id) || { planned_date: date || iso(today), platform: "Instagram", format: "Reel/Video", topic: "", approved: false, published: false, checklist_id: null, notes: "", post_link: "" };
  openModal(`<h2>${id ? "Edit post" : "New post"}</h2><div class="fields"><label class="f">Planned date<input id="p-date" type="date" value="${p.planned_date}"></label><label class="f">Platform<select id="p-pf">${["Instagram","Facebook","TikTok","YouTube","Other"].map(x => `<option ${p.platform === x ? "selected" : ""}>${x}</option>`).join("")}</select></label><label class="f">Format<select id="p-fm">${["Reel/Video","Story","Carousel","Photo post","Live","Other"].map(x => `<option ${p.format === x ? "selected" : ""}>${x}</option>`).join("")}</select></label><label class="f">Checklist item<select id="p-ci"><option value="">—</option>${D.checklist.map(c => `<option value="${c.id}" ${p.checklist_id === c.id ? "selected" : ""}>${esc(c.item)} (${c.month.slice(0, 7)})</option>`).join("")}</select></label></div>
  <label class="f">Topic / caption idea<input id="p-topic" value="${esc(p.topic)}"></label><div class="fields"><label class="f">Post link<input id="p-link" value="${esc(p.post_link || "")}"></label><label class="f">Notes<input id="p-notes" value="${esc(p.notes || "")}"></label></div>
  <div class="actions"><label><input type="checkbox" id="p-ap" ${p.approved ? "checked" : ""} ${sw("D4") ? "" : "disabled"}> Approved to post${sw("D4") ? "" : " <span class='muted small'>(needs approval rights)</span>"}</label><label><input type="checkbox" id="p-pub" ${p.published ? "checked" : ""}> Published</label></div>
  <div class="actions" style="justify-content:flex-end">${id ? `<button class="btn ghost" onclick="delRow('content_posts','${id}')">Delete</button>` : ""}<button class="btn ghost keep" onclick="closeModal()">Cancel</button><button class="btn primary" id="p-go">Save</button></div>`);
  $("#p-go").onclick = async () => { const row = { planned_date: $("#p-date").value, platform: $("#p-pf").value, format: $("#p-fm").value, checklist_id: $("#p-ci").value || null, topic: $("#p-topic").value, post_link: $("#p-link").value, notes: $("#p-notes").value, approved: $("#p-ap").checked, published: $("#p-pub").checked, approved_at: $("#p-ap").checked ? (p.approved_at || new Date().toISOString()) : null, published_at: $("#p-pub").checked ? (p.published_at || new Date().toISOString()) : null };
    const { error } = id ? await sb.from("content_posts").update(row).eq("id", id) : await sb.from("content_posts").insert(row); if (error) return toast(error.message); closeModal(); await load(); render(); }; }
function editItem(id){ const c = D.checklist.find(x => x.id === id) || { month: `${cur.y}-${String(cur.m + 1).padStart(2, "0")}-01`, item: "", platform: "Instagram", format: "Reel/Video", required_qty: 4, due_by: null, brief: "", needs_approval: true };
  openModal(`<h2>${id ? "Edit item" : "New checklist item"}</h2><div class="fields"><label class="f">Month<input id="c-month" type="month" value="${c.month.slice(0, 7)}"></label><label class="f">Required quantity<input id="c-qty" type="number" value="${c.required_qty}"></label><label class="f">Platform<select id="c-pf">${["Instagram","Facebook","TikTok","YouTube","Other"].map(x => `<option ${c.platform === x ? "selected" : ""}>${x}</option>`).join("")}</select></label><label class="f">Format<select id="c-fm">${["Reel/Video","Story","Carousel","Photo post","Live","Other"].map(x => `<option ${c.format === x ? "selected" : ""}>${x}</option>`).join("")}</select></label><label class="f">Due by<input id="c-due" type="date" value="${c.due_by || ""}"></label></div>
  <label class="f">Item name<input id="c-item" value="${esc(c.item)}"></label><label class="f" style="margin-top:8px">Brief<textarea id="c-brief" rows="2">${esc(c.brief || "")}</textarea></label>
  <div class="actions" style="justify-content:flex-end">${id ? `<button class="btn ghost" onclick="delRow('content_checklist','${id}')">Delete</button>` : ""}<button class="btn ghost keep" onclick="closeModal()">Cancel</button><button class="btn primary" id="c-go">Save</button></div>`);
  $("#c-go").onclick = async () => { const row = { month: $("#c-month").value + "-01", required_qty: +$("#c-qty").value || 0, platform: $("#c-pf").value, format: $("#c-fm").value, due_by: $("#c-due").value || null, item: $("#c-item").value, brief: $("#c-brief").value };
    const { error } = id ? await sb.from("content_checklist").update(row).eq("id", id) : await sb.from("content_checklist").insert(row); if (error) return toast(error.message); closeModal(); await load(); render(); }; }
function editLog(id){ const l = D.log.find(x => x.id === id) || { received_at: new Date().toISOString(), channel: "Facebook", customer: "", enquiry_type: "Table reservation", branch: "San Antonio Place", first_reply_at: null, status: "New", booking_value: "", verified: false, notes: "" };
  const dtl = v => v ? new Date(new Date(v).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : "";

  <label class="f">Notes<input id="g-notes" value="${esc(l.notes || "")}"></label><div class="actions"><label><input type="checkbox" id="g-ver" ${l.verified ? "checked" : ""}> Verified by company (counts for commission)</label></div>
  <div class="actions" style="justify-content:flex-end">${id ? `<button class="btn ghost" onclick="delRow('enquiry_log','${id}')">Delete</button>` : ""}<button class="btn ghost keep" onclick="closeModal()">Cancel</button><button class="btn primary" id="g-go">Save</button></div>`);
  $("#g-go").onclick = async () => { const row = { received_at: new Date($("#g-rec").value).toISOString(), channel: $("#g-ch").value, customer: $("#g-cust").value, enquiry_type: $("#g-type").value, branch: $("#g-br").value, first_reply_at: $("#g-rep").value ? new Date($("#g-rep").value).toISOString() : null, status: $("#g-st").value, booking_value: $("#g-val").value || null, verified: $("#g-ver").checked, notes: $("#g-notes").value };
    const { error } = id ? await sb.from("enquiry_log").update(row).eq("id", id) : await sb.from("enquiry_log").insert(row); if (error) return toast(error.message); closeModal(); await load(); render(); }; }
async function delRow(table, id){ if (!confirm("Delete this?")) return; const { error } = await sb.from(table).delete().eq("id", id); if (error) return toast(error.message); closeModal(); await load(); render(); }

/* ---------- settings ---------- */
const KINDL = { table: "Free table", group: "Big group", event: "Private event" };
function set(){ const r = D.settings.reservation || {}, c = D.settings.contact || {}, pay = D.settings.payment || {}, owner = sw("C3"), iEdit = can("I", "edit"), isHr = can("C", "edit"), admin = sw("I4");
  document.body.classList.remove("ro"); pageRo = false;
  $("#main").innerHTML = `<h1>Settings</h1>${setTabs()}<div class="grid set-grid" data-st="${stab}">${can("I") || owner ? `
    <div class="card"><h3>Table and group rules</h3><div class="fields">${[["minutes","Reservation window (minutes)"],["grace_minutes","Grace period (minutes)"],["table_max","Max guests for a free table"],["group_min","Big group from"],["group_max","Big group up to"],["group_rate","Minimum consumable per guest ₱"],["group_dp","Down payment per guest ₱"],["pencil_hours","Pencil hold (hours)"]].map(([k, l]) => `<label class="f">${l}<input id="s-${k}" type="number" value="${r[k] ?? ""}" ${owner ? "" : "disabled"}></label>`).join("")}</div>${owner ? `<button class="btn sm primary" onclick="saveSetting('reservation',${JSON.stringify(["minutes","grace_minutes","table_max","group_min","group_max","group_rate","group_dp","pencil_hours"]).replace(/"/g, "&quot;")},true)">Save</button>` : `<div class="muted small">Only someone with "Edit house rules" access can change these.</div>`}</div>

    <div class="card"><h3>Bank details per branch</h3><p class="muted small">Shown on the SOA, the SOA email and the big-group confirmation. QR codes are no longer used.</p>${["sa","ju"].map(b => { const p = bankOf(b); return `<div style="margin:12px 0 6px;font-weight:700">${BRN[b]}</div><div class="fields">${[["bank_name","Bank"],["account_name","Account name"],["account_no","Account no."],["swift","SWIFT code (optional)"]].map(([k, l]) => `<label class="f">${l}<input id="s-pay-${b}-${k}" value="${esc(p[k] || "")}" ${iEdit ? "" : "disabled"}></label>`).join("")}</div>`; }).join("")}
      <label class="f" style="margin-top:10px">Note under the bank details<textarea id="s-pay-note" rows="4" ${iEdit ? "" : "disabled"}>${esc(payNote())}</textarea></label>${iEdit ? `<button class="btn sm primary" style="margin-top:12px" onclick="savePayment()">Save bank details</button>` : ""}</div>
    <div class="card"><h3>Branch locations (clock-in check)</h3><p class="muted small">Stand inside the branch and tap "Use my location". Staff pick the branch they're at, and the staff app only lets them clock in with location on and within the radius of that spot (20 m by default). Phone GPS indoors can drift 10–30 m, so set the spot near the clock-in area and raise the radius if people get blocked.</p>${["sa","ju","fm"].map(b => { const g = (D.settings.geofence || {})[b] || {}; return `<div style="margin:12px 0 6px;font-weight:700">${{sa:"San Antonio Place",ju:"Jupiter Street",fm:"Funhan Mart · Arnaiz"}[b]}</div><div class="fields"><label class="f">Latitude<input id="gf-${b}-lat" value="${g.lat ?? ""}" ${iEdit ? "" : "disabled"}></label><label class="f">Longitude<input id="gf-${b}-lng" value="${g.lng ?? ""}" ${iEdit ? "" : "disabled"}></label><label class="f">Radius (m)<input id="gf-${b}-radius" type="number" value="${g.radius ?? 20}" ${iEdit ? "" : "disabled"}></label></div>${iEdit ? `<button class="btn sm ghost" onclick="gfHere('${b}')">Use my location</button>${g.lat ? ` <a class="small" target="_blank" href="https://maps.google.com/?q=${g.lat},${g.lng}">Check on map</a>` : ""}` : ""}`; }).join("")}${iEdit ? `<div><button class="btn sm primary" style="margin-top:12px" onclick="saveGeo()">Save locations</button></div>` : ""}</div>
    <div class="card"><h3>House rules</h3><label class="f">Fridays: small tables walk-in only<select id="s-rule-friday" ${owner ? "" : "disabled"}><option value="true" ${r.friday_tables_blocked ? "selected" : ""}>Yes, block free table bookings on Fridays</option><option value="false" ${!r.friday_tables_blocked ? "selected" : ""}>No, allow</option></select></label>${owner ? `<button class="btn sm primary" style="margin-top:10px" onclick="saveRules()">Save</button>` : ""}</div>` : ""}
    ${can("C") ? `<div class="card" style="grid-column:1/-1"><h3>Blocked dates</h3><p class="muted small">Block a date or a range for events like Beyblade nights or the private-events season. Pick which booking types are blocked; types you tick under "warn only" still go through but the customer sees your note.</p>
      <table><tr><th>Dates</th><th>Branch</th><th>Blocked</th><th>Warn only</th><th>Reason / note</th><th></th></tr>${D.blocks.filter(b => b.active).map(b => `<tr><td style="white-space:nowrap">${fmt(pd(b.from_date))}${b.to_date !== b.from_date ? " – " + fmt(pd(b.to_date)) : ""}${b.to_date < iso(today) ? " <span class='muted small'>(past)</span>" : ""}</td><td>${b.branch === "all" ? "Both" : BRN[b.branch]}</td><td>${(b.kinds || []).map(k => `<span class="chip c-Lost">${KINDL[k]}</span>`).join(" ") || "<span class='muted'>—</span>"}</td><td>${(b.note_kinds || []).map(k => `<span class="chip c-Pencil">${KINDL[k]}</span>`).join(" ") || "<span class='muted'>—</span>"}</td><td><b>${esc(b.reason || "")}</b>${b.note ? `<br><span class="small muted">${esc(b.note)}</span>` : ""}</td><td>${isHr ? `<button class="btn sm ghost" onclick="cancelBlock('${b.id}')">Cancel block</button>` : ""}</td></tr>`).join("") || "<tr><td colspan='6' class='muted'>No active blocks.</td></tr>"}</table>
      ${isHr ? `<div class="fields" style="margin-top:12px"><label class="f">From<input id="bk-from" type="date" value="${iso(today)}"></label><label class="f">To<input id="bk-to" type="date" value="${iso(today)}"></label><label class="f">Branch<select id="bk-br"><option value="all">Both branches</option>${Object.entries(BRN).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></label><label class="f">Reason (shown to customers)<input id="bk-reason" placeholder="Beyblade tournament"></label></div>

      <label class="f">Note shown to warned bookings<textarea id="bk-note" rows="2" placeholder="Your table is confirmed but may be cancelled if the venue is booked for an event; please check our Facebook page on the day."></textarea></label><button class="btn sm primary" style="margin-top:10px" onclick="addBlock()">Add block</button>` : ""}</div>` : ""}
    ${can("I") ? `<div class="card"><h3>Branches</h3>${D.branches.map(b => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(b.name)}</b> · ${String(b.open_time).slice(0, 5)}–${String(b.close_time).slice(0, 5)}<br><span class="muted small">Tables: ${Object.entries(b.areas).map(([a, n]) => a + " " + n).join(", ")} · event minimums eve ${b.rates.eve.map(peso).join(" / ")}, aft ${b.rates.aft.map(peso).join(" / ")}</span></div>`).join("")}<p class="muted small">Table counts and event rates are edited in the Supabase table "branches" for now.</p></div>` : ""}
    ${sw("I5") ? `<div class="card"><h3>Backup</h3><p class="muted small">Downloads every table (bookings, events, employees, schedules, punches, payroll, settings) as one file you can keep. Do this before any big change and once a week.</p><button class="btn sm" onclick="backupAll()">Download backup</button></div>` : ""}
    <div class="card"><h3>My password</h3><p class="muted small">Signed in as ${esc(me.email)}.</p><div class="fields"><label class="f">New password (8+ characters)<input id="pw1" type="password" autocomplete="new-password"></label><label class="f">Repeat<input id="pw2" type="password" autocomplete="new-password"></label></div><button class="btn sm" onclick="changePw()">Change password</button></div>
    ${can("I") || admin ? `<div class="card" style="grid-column:1/-1"><h3>Portal users &amp; access</h3><p class="muted small">Each person gets a role preset, then you can fine-tune what they see (view) and what they can change (edit) per area. Owners always have everything.</p><table><tr><th>Person</th><th>Role</th><th>Access</th>${admin ? "<th></th>" : ""}</tr>${D.staff.map(s => { const p = permsOf(s); return `<tr><td><b>${esc(s.name || "")}</b><br><span class="muted small">${esc(s.email)}</span></td><td><span class="role-chip">${esc(ROLE_NAMES[s.role] || s.role)}</span></td><td class="small">${s.role === "owner" ? "Full access" : PERM_CATS.filter(([k]) => p[k] !== "none").map(([k, l]) => `${({A:"Bookings",B:"Events",C:"Calendar",D:"Marketing",E:"Playbook",S:"Seating",F:"HR people",G:"HR time",H:"Payroll",I:"Settings"})[k]} <span class="muted">${p[k]}</span>`).join(" · ") || "<span class='muted'>nothing yet</span>"}</td>${admin ? `<td style="white-space:nowrap"><button class="btn sm ghost" onclick="editAccess('${s.id}')">Access</button> <button class="btn sm ghost" onclick="rmStaff('${s.id}')">Remove</button></td>` : ""}</tr>`; }).join("")}</table>
      ${admin ? `<div class="fields" style="margin-top:10px"><label class="f">Name<input id="st-name"></label><label class="f">Email<input id="st-email" type="email"></label><label class="f">Role<select id="st-role"><option value="">Choose a role…</option>${Object.entries(ROLE_NAMES).filter(([k]) => k !== "owner" || myRole === "owner").map(([k, n]) => `<option value="${k}">${n}</option>`).join("")}</select></label></div><button class="btn sm" onclick="addStaff()">Add person</button><p class="muted small">Presets: <b>Owner</b> and <b>Executive assistant</b> have everything. <b>Manager</b> runs bookings, events, marketing and HR and prepares payroll (the owner approves it). <b>Marketing associate</b> handles bookings, events, calendar, marketing and the playbook, plus backups. <b>Cashier · branch portal</b> sees bookings and runs table seating. <b>Consultant</b> works events and sees only their own KPI line. After adding someone, click Access to adjust, then invite them under Authentication → Users in Supabase (or they can use "Email me a sign-in link").</p>` : ""}</div>` : ""}</div>`; applySetTab(); }
let stab = "rules";
const SET_SECS = [["rules", "Booking rules"], ["contact", "Contact & payments"], ["access", "Team access"], ["account", "My account"]];
const SET_MAP = { "Table and group rules": "rules", "House rules": "rules", "Blocked dates": "rules", "Branches": "rules", "Contact details": "contact", "Bank details per branch": "contact", "Branch locations (clock-in check)": "rules", "Portal users & access": "access", "My password": "account", "Backup": "account" };
function setTabs(){ return `<div class="tabs" id="set-tabs">${SET_SECS.map(([k, l]) => `<button aria-pressed="${stab === k}" data-s="${k}" onclick="stab='${k}';applySetTab()">${l}</button>`).join("")}</div>`; }
function applySetTab(){ const cards = [...document.querySelectorAll(".set-grid > .card")], sec = c => SET_MAP[c.querySelector("h3")?.textContent.trim()] || "rules";
  const have = new Set(cards.map(sec)); if (!have.has(stab)) stab = SET_SECS.find(([k]) => have.has(k))?.[0] || "rules";
  cards.forEach(c => c.hidden = sec(c) !== stab); document.querySelectorAll("#set-tabs button").forEach(b => { b.hidden = !have.has(b.dataset.s); b.setAttribute("aria-pressed", b.dataset.s === stab); }); }
function editAccess(id){ const s = D.staff.find(x => x.id === id); if (!s) return; if (s.role === "owner" && myRole !== "owner") return toast("Only an owner can change an owner account"); let role = s.role, p = { ...permsOf(s) };
  const draw = () => { const locked = role === "owner"; $("#modal-in").innerHTML = `<h2>${esc(s.name || s.email)}</h2><p class="muted small">${esc(s.email)}</p>
    <div class="fields"><label class="f">Role preset<select id="ac-role" ${myRole !== "owner" && role === "owner" ? "disabled" : ""}>${Object.entries(ROLE_NAMES).filter(([k]) => k !== "owner" || myRole === "owner").map(([k, n]) => `<option value="${k}" ${role === k ? "selected" : ""}>${n}</option>`).join("")}</select></label><div style="align-self:end"><button class="btn sm ghost" id="ac-reset">Reset to preset</button></div></div>
    ${locked ? `<p class="muted">Owners always have full access.</p>` : `<h3 style="margin-top:14px">Areas</h3><div class="perm-grid">${PERM_CATS.map(([k, l]) => `<div>${l}</div><div class="lv">${["none","view","edit"].map(v => `<button aria-pressed="${p[k] === v}" data-k="${k}" data-v="${v}">${v}</button>`).join("")}</div>`).join("")}</div>
    <h3 style="margin-top:16px">Special rights</h3><div style="display:grid;gap:6px">${PERM_SW.map(([k, l]) => `<label><input type="checkbox" class="ac-sw" value="${k}" ${p[k] ? "checked" : ""}> ${l}</label>`).join("")}</div>`}
    <div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost keep" onclick="closeModal()">Cancel</button><button class="btn primary" id="ac-save">Save access</button></div>`;
    $("#ac-role").onchange = e => { role = e.target.value; p = { ...(ROLE_PRESETS[role] || ROLE_PRESETS.events) }; draw(); };
    $("#ac-reset").onclick = () => { p = { ...(ROLE_PRESETS[role] || ROLE_PRESETS.events) }; draw(); };
    document.querySelectorAll(".perm-grid .lv button").forEach(b => b.onclick = () => { p[b.dataset.k] = b.dataset.v; draw(); });
    document.querySelectorAll(".ac-sw").forEach(c => c.onchange = () => { p[c.value] = c.checked; });
    $("#ac-save").onclick = async () => { const { error } = await sb.from("staff").update({ role, perms: role === "owner" ? null : p }).eq("id", s.id); if (error) return toast(error.message); closeModal(); await load(); render(); toast("Access saved"); }; };
  openModal(""); draw(); }
/* ---------- table seating (coming soon) ---------- */
let seatBr = "ju";
function seat(){ ro("S"); const edit = can("S", "edit");
  $("#main").innerHTML = `<h1>Table seating<span class="soon">Coming soon</span></h1><p class="muted" style="max-width:70ch">This is where the branch team will see tonight's bookings on the floor map and seat, move or clear tables. ${edit ? "You'll have seating controls here." : "You'll have view access here."} For now, here is the blueprint.</p>
  <div class="tabs">${[["ju","Jupiter Street"],["sa","San Antonio Place"]].map(([k, n]) => `<button aria-pressed="${seatBr === k}" onclick="seatBr='${k}';seat()">${n}</button>`).join("")}</div>
  ${seatBr === "ju" ? `<div class="card" style="max-width:720px;background:#000;padding:0;overflow:hidden"><img src="floor-jupiter.png" alt="Jupiter Street floor map, 42 pax" style="display:block;width:100%;height:auto"></div><p class="muted small" style="margin-top:8px">Jupiter Street · 42 pax · 3 four-seaters by the projector/karaoke wall, 2 six-seaters in the middle, 3 four-seaters by the couch. Bar, arcade, kitchen and restroom marked.</p>` : `<div class="card empty" style="max-width:720px">San Antonio Place blueprint not uploaded yet.</div>`}`; }
async function saveSetting(key, fields, numeric){ const base = D.settings[key] || {}; const v = { ...base }; fields.forEach(f => { const el = $(`#s-${key === "reservation" ? f : key + "-" + f}`); v[f] = numeric ? +el.value : el.value; });
  const { error } = await sb.from("settings").upsert({ key, value: v }); if (error) return toast(error.message); D.settings[key] = v; toast("Saved"); }
async function backupAll(){ const tables = ["bookings","inquiries","activity","settings","branches","staff","content_posts","content_checklist","enquiry_log","consultant_terms","employees","schedules","punches","attendance_exceptions","holidays","leaves","payroll_runs","payroll_lines","timesheet_imports"]; const out = { exported_at: new Date().toISOString(), by: me.email, tables: {} };
  for (const t of tables){ const { data, error } = await sb.from(t).select("*"); out.tables[t] = error ? { error: error.message } : data; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: "application/json" })); a.download = `catchinup-backup-${iso(new Date())}.json`; a.click(); toast("Backup downloaded"); }
function gfHere(b){ if (!navigator.geolocation) return toast("This browser can't share location"); toast("Getting your location…"); navigator.geolocation.getCurrentPosition(p => { $(`#gf-${b}-lat`).value = p.coords.latitude.toFixed(6); $(`#gf-${b}-lng`).value = p.coords.longitude.toFixed(6); toast(`Got it (±${Math.round(p.coords.accuracy)} m). Press Save locations.`); }, e => toast("Couldn't get location: " + e.message), { enableHighAccuracy: true, timeout: 15000 }); }
async function saveGeo(){ const v = {}; ["sa","ju","fm"].forEach(b => { const lat = parseFloat($(`#gf-${b}-lat`).value), lng = parseFloat($(`#gf-${b}-lng`).value); if (!isNaN(lat) && !isNaN(lng)) v[b] = { lat, lng, radius: +$(`#gf-${b}-radius`).value || 20 }; });
  const { error } = await sb.from("settings").upsert({ key: "geofence", value: v }); if (error) return toast(error.message); D.settings.geofence = v; toast("Branch locations saved"); }
async function savePayment(){ const v = {}; ["sa","ju"].forEach(b => { v[b] = Object.fromEntries(["bank_name","account_name","account_no","swift"].map(k => [k, $(`#s-pay-${b}-${k}`).value.trim()])); }); v.note = $("#s-pay-note").value.trim();
  const { error } = await sb.from("settings").upsert({ key: "payment", value: v }); if (error) return toast(error.message); D.settings.payment = v; toast("Saved"); }
async function uploadQr(b, k, input){ const f = input.files[0]; if (!f) return; toast("Uploading…"); const path = `qr/${b}-${k}.${(f.name.split(".").pop() || "png").toLowerCase()}`;
  const { error } = await sb.storage.from("assets").upload(path, f, { upsert: true, contentType: f.type }); if (error) return toast(error.message);
  const { data } = sb.storage.from("assets").getPublicUrl(path); const v = { ...(D.settings.payment || {}) }; v[b] = { ...(v[b] || {}), [k]: data.publicUrl };
  const r = await sb.from("settings").upsert({ key: "payment", value: v }); if (r.error) return toast(r.error.message); D.settings.payment = v; toast("QR saved"); render(); }
async function addBlock(){ const kinds = [...document.querySelectorAll(".bk-kind:checked")].map(x => x.value), note_kinds = [...document.querySelectorAll(".bk-note:checked")].map(x => x.value); if (!kinds.length && !note_kinds.length) return toast("Tick at least one booking type"); if (!$("#bk-from").value || !$("#bk-to").value) return toast("Pick the dates");
  const { error } = await sb.from("booking_blocks").insert({ from_date: $("#bk-from").value, to_date: $("#bk-to").value, branch: $("#bk-br").value, kinds, note_kinds, reason: $("#bk-reason").value.trim() || null, note: $("#bk-note").value.trim() || null, created_by: me.email }); if (error) return toast(error.message); await logAct("BLOCK", `${$("#bk-from").value}–${$("#bk-to").value} ${kinds.join("/")} blocked: ${$("#bk-reason").value}`); await load(); render(); toast("Block added"); }
async function cancelBlock(id){ if (!confirm("Cancel this block? Bookings on those dates open again.")) return; const { error } = await sb.from("booking_blocks").update({ active: false }).eq("id", id); if (error) return toast(error.message); await load(); render(); toast("Block cancelled"); }
async function saveRules(){ const v = { ...(D.settings.reservation || {}), friday_tables_blocked: $("#s-rule-friday").value === "true" };
  const { error } = await sb.from("settings").upsert({ key: "reservation", value: v }); if (error) return toast(error.message); D.settings.reservation = v; toast("Rules saved"); }
async function changePw(){ const a = $("#pw1").value, b = $("#pw2").value; if (a.length < 8) return toast("Use at least 8 characters"); if (a !== b) return toast("Passwords don't match"); const { error } = await sb.auth.updateUser({ password: a }); if (error) return toast(error.message); $("#pw1").value = $("#pw2").value = ""; toast("Password changed"); }
async function addStaff(){ const role = $("#st-role").value; if (!$("#st-email").value.trim()) return toast("Add their email first"); if (!role) return toast("Choose a role for this person"); const { error } = await sb.from("staff").insert({ name: $("#st-name").value, email: $("#st-email").value.trim().toLowerCase(), role, perms: role === "owner" ? null : ROLE_PRESETS[role] }); if (error) return toast(error.message); await load(); render(); toast("Added. Click Access to fine-tune."); }
async function rmStaff(id){ if (!confirm("Remove this staff member's access?")) return; const { error } = await sb.from("staff").delete().eq("id", id); if (error) return toast(error.message); await load(); render(); }

start();
</script>

<div class="sl-bg" id="sl"><div class="sl" id="sl-in"></div></div><button class="fb-pill" id="fb-pill" hidden>Feedback</button>
<script>
(function(){ const bg = document.getElementById("sl"), box = document.getElementById("sl-in"), pill = document.getElementById("fb-pill"), KEY = "cu-portal-softlaunch-v1";
  function notice(){ box.innerHTML = `<span class="tag">Soft launch</span><h3>The portal is live, and still settling in.</h3><p>Bookings, events, the response KPI, HR and payroll should all work the way we planned. While we soft-launch, anything that feels slow, confusing or wrong is worth a note; use the Feedback button at the bottom right any time. Your comments shape what gets fixed first.</p><div class="row"><button class="b" id="sl-fb">Send feedback</button><button class="b p" id="sl-ok">Got it</button></div>`;
    bg.classList.add("open"); document.getElementById("sl-ok").onclick = close; document.getElementById("sl-fb").onclick = form; }
  function form(){ box.innerHTML = `<span class="tag">Feedback</span><h3>What should we fix or add?</h3><p>Which page, what you expected, what happened. Screenshots can go to the group chat.</p><textarea id="fb-msg" rows="4" placeholder="Tell us…"></textarea><div class="row"><button class="b" id="fb-cancel">Close</button><button class="b p" id="fb-send">Send</button></div><p id="fb-msgline" style="margin-top:8px"></p>`;
    bg.classList.add("open"); document.getElementById("fb-cancel").onclick = close;
    document.getElementById("fb-send").onclick = async () => { const m = document.getElementById("fb-msg").value.trim(); const line = document.getElementById("fb-msgline"); if (m.length < 3) { line.textContent = "Please write a few words first."; return; } line.textContent = "Sending…";
      try { const cfg = window.CU_CONFIG || {}; const r = await fetch(cfg.ENDPOINT, {method:"POST", headers:{"Content-Type":"application/json", apikey: cfg.ANON_KEY || "", Authorization: "Bearer " + (cfg.ANON_KEY || "")}, body: JSON.stringify({type:"feedback", source:"portal", page: "manage/" + (typeof page !== "undefined" ? page : ""), message: m, name: (typeof me !== "undefined" && me && me.email) || "", contact: (typeof me !== "undefined" && me && me.email) || "", version: cfg.VERSION})}); const j = await r.json(); if (!j.ok) throw new Error(j.error || "failed");
        box.innerHTML = `<span class="tag">Thank you</span><h3>Noted.</h3><p>It goes straight to the owner's inbox and is kept in the feedback list.</p><div class="row"><button class="b p" id="fb-done">Close</button></div>`; document.getElementById("fb-done").onclick = close; }
      catch (e) { line.textContent = "Couldn't send right now. Drop it in the group chat instead."; } }; }
  function close(){ bg.classList.remove("open"); try { localStorage.setItem(KEY, "1"); } catch (e) {} pill.hidden = false; }
  bg.onclick = e => { if (e.target === bg) close(); }; pill.onclick = form;
  let seen = false; try { seen = !!localStorage.getItem(KEY); } catch (e) {}
  window.showSoftLaunch = () => { if (seen) { pill.hidden = false; return; } setTimeout(notice, 500); };
})();
</script>
